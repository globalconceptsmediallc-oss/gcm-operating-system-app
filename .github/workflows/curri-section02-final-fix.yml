name: Fix Curri Section 02 assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/curri-section02-final-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verified Section 02 assets and patch page
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/curri-assets-ready
          git show origin/fix/curri-assets-ready:prospect-previews/john-curri/assets/test-postcard.webp > prospect-previews/john-curri/assets/postcard-concept.webp
          git show origin/fix/curri-assets-ready:prospect-previews/john-curri/assets/test-social.webp > prospect-previews/john-curri/assets/social-concept.webp

          python - <<'PY'
          from pathlib import Path

          page = Path('prospect-previews/john-curri/index.html')
          s = page.read_text()

          s = s.replace('Version: 1.1.3', 'Version: 1.1.4', 1)
          marker = '   Change Notes — 1.1.3:'
          if 'Change Notes — 1.1.4:' not in s:
              s = s.replace(
                  marker,
                  '   Change Notes — 1.1.4:\n'
                  '   - Replaces both Section 02 images with verified standalone WebP assets.\n'
                  '   - Removes the broken JPEG delivery path that Safari was failing to render.\n'
                  '   - Preserves page layout and prospect engagement tracking.\n'
                  + marker,
                  1,
              )

          s = s.replace(
              'src="assets/postcard-concept.jpg"',
              'src="assets/postcard-concept.webp?v=114"',
              1,
          )
          s = s.replace(
              'src="assets/social-concept.jpg"',
              'src="assets/social-concept.webp?v=114"',
              1,
          )
          s = s.replace('const FILE_VERSION = "1.1.3";', 'const FILE_VERSION = "1.1.4";', 1)

          if 'assets/postcard-concept.webp?v=114' not in s or 'assets/social-concept.webp?v=114' not in s:
              raise SystemExit('Section 02 asset references were not patched; refusing to commit.')

          page.write_text(s)
          PY

          rm -f .github/workflows/curri-section02-final-fix.yml

      - name: Commit fixed page and assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix Curri Section 02 image rendering"
          git push
