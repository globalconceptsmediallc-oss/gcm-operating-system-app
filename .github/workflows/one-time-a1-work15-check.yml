name: One-Time A1 Work 15 Check

on:
  push:
    paths:
      - ".github/workflows/one-time-a1-work15-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live A1 Work Item 15
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";
          const response = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"get-client-workspace", clientCode:"A1" })
          });
          const data = await response.json();
          if (!response.ok || data?.ok !== true) throw new Error(data?.error || `HTTP ${response.status}`);
          const items = data?.operational?.workItems || [];
          const item = items.find(x => Number(x.id) === 15) || null;
          console.log("WORK15", JSON.stringify(item));
          NODE
