name: Gmail Thread Routing Bootstrap

on:
  push:
    branches:
      - gmail-thread-routing-20260826

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ contains(github.event.head_commit.message, '[thread-routing-ci]') == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and run patch script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/gmail-thread-routing-test.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          compile(script, '/tmp/gmail_thread_patch.py', 'exec')
          Path('/tmp/gmail_thread_patch.py').write_text(script)
          exec(compile(script, '/tmp/gmail_thread_patch.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Run full production tests
        run: npm test

      - name: Commit tested production files
        shell: bash
        run: |
          git config user.name "globalconceptsmediallc-oss"
          git config user.email "globalconceptsmediallc@gmail.com"
          git add routes/gmailDispositions.js shared/today-gmail-decisions.js tests/gmailHandleNow.test.js tests/gmailSourceEmailDisplay.test.js tests/gmailThreadRouting.test.js package.json
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Make Morning Command Gmail thread-aware [thread-routing-ci]"
          git push origin HEAD:gmail-thread-routing-20260826
