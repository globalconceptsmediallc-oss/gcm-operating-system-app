# =========================================================
# Global Concepts Media Operating System
# File: .github/workflows/gcm-worker-deploy.yml
# Version: 1.5.69
# Status: Production Deployment Candidate
# Purpose: Test and deploy the GCM OS Worker with human-led Signal Finding capture.
# Change Notes:
# - Deploy Worker 7.40.0 with D1-backed Forward Look row dispositions so closed passed items stay closed after refresh.
# - Deploy interactive Forward Look passed radio/traffic closure with Schedule Operations 1.1.0 and migration 0038.
# - Deploy Mission Control 7.8.4 so Nurture / Hold engagement is suppressed from Today without deleting history.
# - Re-run Prospect CRM 1.6.0 deployment after aligning remaining test-site regression locks.
# - Deploy Prospect CRM 1.6.0 and migration 0037 for shared Prospect/Radar Nurture-Hold lifecycle.
# - Deploy Prospect Intelligence 1.5.1 and Business Intelligence Record 1.1.7 after Rolling Suds relationship-source road test.
# - Deploy source-aware Prospect Intelligence 1.5.0 and Business Intelligence Record 1.1.6.
# - Lock Prospect Concept Tracking 1.1.2 with Window World Space Coast direct-mail engagement tracking.
# - Align live verification with Gmail Intake Sync 1.3.0 after the monitored-source expansion.
# - Re-run production deployment after aligning the Gmail Intake Sync regression lock to the live 1.3.0 route.
# - Lock Prospect Concept Tracking 1.1.1 with Rolling Suds commercial-growth engagement tracking.
# - Verify the eighth SES Q4 Social Impact baseline observation seeded by migration 0036: 129 Large Gun Safes page views.
# - Verify the seventh SES Q4 Social Impact baseline observation seeded by migration 0035: 195 Centurion 24 page views.
# - Verify the sixth SES Q4 Social Impact baseline observation seeded by migration 0034: 223 Lincoln Series page views.
# - Verify the fifth SES Q4 Social Impact baseline observation seeded by migration 0033: 187 page views for the Protect page/screen.
# - Verify the fourth SES Q4 Social Impact baseline observation seeded by migration 0032: Events = 8000.
# - Verify the third SES Q4 Social Impact baseline observation seeded by migration 0031: Avg engagement time = 76 seconds.
# - Verify the second SES Q4 Social Impact baseline observation seeded by migration 0030: New Users = 836.
# - Verify the first SES Q4 Social Impact baseline observation seeded by migration 0029.
# - Deploy and verify Worker 7.39.0 with D1-backed Measurement Observations.
# - Verify measurement-observations health/action/list contract and migration 0028 before declaring deployment healthy.
# - Deploy and verify Worker 7.38.0 with durable Schedule Operations authority.
# - Verify migration 0027 and schedule-operations list contract before declaring deployment healthy.
# - Deploy and verify Worker 7.37.0 with Gmail ↔ Universal Intake reconciliation.
# - Verify Finance Operations 1.2.0 is authoritative for permanent Billing operations.
# - Regression suite accepts the current delegated Gmail 1.7.x header while locking runtime 1.7.5.
# - Prospect regression locks now follow current CRM 1.5.0 and Today/Prospects release families.
# - Prospect Engagement regression now targets the current dedicated Today panel.
# - Prospect Engagement assertions now match the consolidated grouped ×N Today view.
# - Migration journal repaired through 0025; 0026 Finance migration can now apply normally.
# - Align Gmail disposition regression locks with installed helper-export versions.
# - LOCK: require Worker 7.35.0, Gmail Intake Sync 1.2.0, Email Intake 1.0.0, Email Intake Queue 1.1.0, Email Intake Disposition 1.5.4, Email Intake Finding 1.1.0, Google Review Quick Action 1.0.2, Prospect Concept Tracking 1.1.2, and Prospect CRM 1.6.0.
# - Preserve all existing live boundary checks while adding the no-action D1 disposition route.
# - Verify prospect-concept-view is live using an unknown-key no-write boundary test.
# - Verify CRM D1 migrations are live by reading list_prospects and service catalog.
# - Verify the core business rule that a formal Prospect cannot be created
#   without a real scheduled appointment.
# - Verify service/startup route boundaries without creating test Prospect records.
# - Verify Media Production Sessions v1.1.1 and migration 0011 are live.
# - Verify Mission Control recognizes media_production_sessions as a Media deadline source.
# - Preserve Gmail operator-decision routes, Calendar, Work due-date source,
#   Operating Sessions, and auth boundaries.
# =========================================================

name: GCM Worker Deploy

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "routes/**"
      - "shared/**"
      - "wrangler.toml"
      - "package.json"
      - "migrations/**"
      - ".github/workflows/gcm-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcm-production-worker
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Production Tests
        run: npm test

      - name: Apply Additive D1 Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.122.0"
          command: d1 migrations apply DB --remote

      - name: Validate OpenAI Service Key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          node <<'NODE'
          const response = await fetch("https://api.openai.com/v1/models/gpt-5.4", {
            headers:{ Authorization:`Bearer ${process.env.OPENAI_API_KEY}` }
          });
          if(!response.ok){
            const payload=await response.json().catch(()=>({}));
            throw new Error(`OpenAI service key/model check failed: ${payload?.error?.message||`HTTP ${response.status}`}`);
          }
          console.log("PASS OpenAI service key and gpt-5.4 model access");
          NODE

      - name: Deploy GCM Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.122.0"
          command: deploy

      - name: Verify Live OS 2.0 Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const url = process.env.WORKER_URL;
          const healthResponse = await fetch(url);
          if (!healthResponse.ok) throw new Error(`Worker health returned HTTP ${healthResponse.status}`);
          const health = await healthResponse.json();
          if (health.workerFileVersion !== "7.40.0") {
            throw new Error(`Expected Worker 7.40.0, received ${health.workerFileVersion || "unknown"}`);
          }
          if (health.emailIntakeVersion !== "1.0.0") {
            throw new Error(`Expected Email Intake 1.0.0, received ${health.emailIntakeVersion || "unknown"}`);
          }
          if (health.emailIntakeQueueVersion !== "1.1.0") {
            throw new Error(`Expected Email Intake Queue 1.1.0, received ${health.emailIntakeQueueVersion || "unknown"}`);
          }
          if (health.emailIntakeDispositionVersion !== "1.5.4") {
            throw new Error(`Expected Email Intake Disposition 1.5.4, received ${health.emailIntakeDispositionVersion || "unknown"}`);
          }
          if (health.emailIntakeFindingVersion !== "1.1.0") {
            throw new Error(`Expected Email Intake Finding 1.1.0, received ${health.emailIntakeFindingVersion || "unknown"}`);
          }
          if (health.googleReviewQuickActionVersion !== "1.0.2") {
            throw new Error(`Expected Google Review Quick Action 1.0.2, received ${health.googleReviewQuickActionVersion || "unknown"}`);
          }
          if (health.gmailIntakeSyncVersion !== "1.3.0") {
            throw new Error(`Expected Gmail Intake Sync 1.3.0, received ${health.gmailIntakeSyncVersion || "unknown"}`);
          }
          if (health.clientFindingsVersion !== "1.0.0") {
            throw new Error(`Expected Client Findings 1.0.0, received ${health.clientFindingsVersion || "unknown"}`);
          }
          if (health.scheduleOperationsVersion !== "1.1.0") {
            throw new Error(`Expected Schedule Operations 1.1.0, received ${health.scheduleOperationsVersion || "unknown"}`);
          }
          if (health.forwardLookOperationsVersion !== "1.0.0") {
            throw new Error(`Expected Forward Look Operations 1.0.0, received ${health.forwardLookOperationsVersion || "unknown"}`);
          }
          if (health.measurementObservationsVersion !== "1.0.0") {
            throw new Error(`Expected Measurement Observations 1.0.0, received ${health.measurementObservationsVersion || "unknown"}`);
          }
          const financeResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"finance-operations", operation:"list" })
          });
          if (!financeResponse.ok) {
            throw new Error(`Finance Operations returned HTTP ${financeResponse.status}`);
          }
          const finance = await financeResponse.json();
          if (finance?.financeOperationsVersion !== "1.2.0") {
            throw new Error(`Expected Finance Operations 1.2.0, received ${finance?.financeOperationsVersion || "unknown"}`);
          }
          if (!Number.isInteger(finance?.latestNumericInvoice) || !Number.isInteger(finance?.nextInvoiceNumber)) {
            throw new Error("Finance Operations did not return numeric invoice authority from D1.");
          }
          if (finance.nextInvoiceNumber !== finance.latestNumericInvoice + 1) {
            throw new Error(`Finance invoice numbering is inconsistent: latest ${finance.latestNumericInvoice}, next ${finance.nextInvoiceNumber}`);
          }
          console.log(`PASS Finance D1 invoice numbering: latest ${finance.latestNumericInvoice}, next ${finance.nextInvoiceNumber}`);
          const financePreviewResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
              action:"finance-operations",
              operation:"create_invoice",
              dryRun:true,
              accountName:"Southeast Safes",
              invoiceType:"monthly",
              invoiceDate:"2026-10-03",
              billingPeriod:"Services performed during September 2026",
              emailTo:"Adrianne@sesafes.com",
              extras:[]
            })
          });
          if (!financePreviewResponse.ok) {
            throw new Error(`Finance Create Invoice dry run returned HTTP ${financePreviewResponse.status}`);
          }
          const financePreview = await financePreviewResponse.json();
          if (financePreview?.dryRun !== true || financePreview?.writesPerformed !== 0) {
            throw new Error("Finance Create Invoice dry run attempted or reported a production write.");
          }
          if (financePreview?.preparedInvoiceNumber !== String(finance.nextInvoiceNumber)) {
            throw new Error(`Finance Create Invoice prepared ${financePreview?.preparedInvoiceNumber || "unknown"} instead of D1 next ${finance.nextInvoiceNumber}`);
          }
          if (financePreview?.amountCents !== 160000 || !Array.isArray(financePreview?.lines) || financePreview.lines.length !== 2) {
            throw new Error("Finance Create Invoice dry run did not reproduce the permanent Southeast Safes $1,600 monthly package.");
          }
          console.log(`PASS Finance Create Invoice dry run: #${financePreview.preparedInvoiceNumber}, $1,600, 2 service lines, 0 writes`);


          const requiredActions = [
            "route-email-intake-disposition",
            "get-email-intake-queue",
            "save-email-intake-finding",
            "google-review-quick-action",
            "sync-gmail-intake",
            "prospect-crm",
            "prospect-concept-view",
            "calendar-operations",
            "schedule-operations",
            "forward-look-operations",
            "measurement-observations",
            "evaluate-gmail-work-request",
            "approve-gmail-work-request",
            "delete-gmail-no-action",
            "save-gmail-information",
            "prepare-operating-session",
            "list-operating-sessions",
            "get-operating-session",
            "create-operating-session",
            "add-operating-session-evidence",
            "add-operating-session-entry",
            "update-operating-session-status"
          ];
          for (const action of requiredActions) {
            if (!health.actions?.includes(action)) throw new Error(`Live Worker is missing ${action}`);
          }

          const conceptBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-concept-view", conceptKey:"deployment-boundary-not-a-real-concept" })
          });
          if (conceptBoundaryResponse.status !== 404) {
            throw new Error(`Prospect concept boundary expected HTTP 404 for an unknown concept key, received ${conceptBoundaryResponse.status}`);
          }
          const conceptBoundary = await conceptBoundaryResponse.json();
          if (conceptBoundary?.action !== "prospect-concept-view" || conceptBoundary?.trackingVersion !== "1.1.2") {
            throw new Error("Prospect concept tracking route is not live with the expected contract.");
          }

          const crmResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"list_prospects" })
          });
          if (!crmResponse.ok) {
            throw new Error(`Prospect CRM list returned HTTP ${crmResponse.status}`);
          }
          const crm = await crmResponse.json();
          if (crm?.ok !== true || !Array.isArray(crm?.prospects)) {
            throw new Error("Prospect CRM live read contract is invalid or D1 migration is unavailable.");
          }

          const serviceCatalogResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"list_service_catalog" })
          });
          if (!serviceCatalogResponse.ok) {
            throw new Error(`Prospect CRM service catalog returned HTTP ${serviceCatalogResponse.status}`);
          }
          const serviceCatalog = await serviceCatalogResponse.json();
          if (serviceCatalog?.prospectCrmVersion !== "1.6.0") {
            throw new Error(`Expected Prospect CRM 1.6.0, received ${serviceCatalog?.prospectCrmVersion || "unknown"}`);
          }
          const requiredServices = ["website_rebuild", "seo_search_visibility", "analytics_measurement", "consulting_agency_of_record"];
          for (const serviceKey of requiredServices) {
            if (!serviceCatalog?.services?.some(service => service?.key === serviceKey)) {
              throw new Error(`Prospect CRM service catalog is missing ${serviceKey}`);
            }
          }

          const startupBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"get_startup_package" })
          });
          if (startupBoundaryResponse.status !== 400) {
            throw new Error(`Startup package boundary expected HTTP 400 without prospectId, received ${startupBoundaryResponse.status}`);
          }

          const radarResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"list_radar" })
          });
          if (!radarResponse.ok) {
            throw new Error(`Prospect Radar list returned HTTP ${radarResponse.status}; Radar continuity migration may be unavailable.`);
          }
          const radar = await radarResponse.json();
          if (radar?.prospectCrmVersion !== "1.6.0" || !Array.isArray(radar?.radar)) {
            throw new Error("Prospect Radar live read contract is invalid or Radar continuity migration is unavailable.");
          }

          const radarDetailBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"get_radar", radarId:2147483647 })
          });
          if (radarDetailBoundaryResponse.status !== 404) {
            throw new Error(`Radar detail boundary expected HTTP 404 for a nonexistent record, received ${radarDetailBoundaryResponse.status}`);
          }
          const radarDetailBoundary = await radarDetailBoundaryResponse.json();
          if (radarDetailBoundary?.operation !== "get_radar") {
            throw new Error("Prospect CRM get_radar operation is not live.");
          }

          const appointmentBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
              action:"prospect-crm",
              operation:"create_prospect",
              businessName:"CRM appointment boundary test"
            })
          });
          if (appointmentBoundaryResponse.status !== 400) {
            throw new Error(`Prospect creation boundary expected HTTP 400 without appointmentAt, received ${appointmentBoundaryResponse.status}`);
          }
          const appointmentBoundary = await appointmentBoundaryResponse.json();
          if (!String(appointmentBoundary?.error || "").toLowerCase().includes("appointment")) {
            throw new Error("Prospect CRM did not enforce the real-appointment creation boundary.");
          }

          const calendarResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"calendar-operations", operation:"list" })
          });
          if (!calendarResponse.ok) {
            throw new Error(`Calendar Operations returned HTTP ${calendarResponse.status}`);
          }
          const calendar = await calendarResponse.json();
          if (calendar?.ok !== true || !Array.isArray(calendar?.calendarAppointments)) {
            throw new Error("Calendar Operations live read contract is invalid.");
          }

          const scheduleResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"schedule-operations", operation:"list" })
          });
          if (!scheduleResponse.ok) {
            throw new Error(`Schedule Operations returned HTTP ${scheduleResponse.status}`);
          }
          const schedule = await scheduleResponse.json();
          if (
            schedule?.ok !== true ||
            schedule?.scheduleOperationsVersion !== "1.0.0" ||
            !Array.isArray(schedule?.scheduleItems) ||
            !Array.isArray(schedule?.scheduleEvents) ||
            !Array.isArray(schedule?.pendingChanges)
          ) {
            throw new Error("Schedule Operations live read contract is invalid or migration 0027 is unavailable.");
          }
          if (!schedule.scheduleItems.some(item => item?.sourceKey === "ses:liberty:fall-savings-2026")) {
            throw new Error("Schedule Operations did not seed the Liberty Fall Savings authoritative record.");
          }
          if (!schedule.scheduleItems.some(item => item?.sourceKey === "ses:gun-show:orlando:2026-10-10")) {
            throw new Error("Schedule Operations did not seed the Orlando October gun-show authoritative record.");
          }
          console.log(`PASS Schedule Operations: ${schedule.scheduleItems.length} durable items, ${schedule.scheduleEvents.length} derived events`);

          const measurementResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
              action:"measurement-observations",
              operation:"list",
              limit:50
            })
          });
          if (!measurementResponse.ok) {
            throw new Error(`Measurement Observations returned HTTP ${measurementResponse.status}`);
          }
          const measurement = await measurementResponse.json();
          if (
            measurement?.ok !== true ||
            measurement?.measurementObservationsVersion !== "1.0.0" ||
            !Array.isArray(measurement?.observations) ||
            measurement?.writesPerformed !== 0
          ) {
            throw new Error("Measurement Observations live read contract is invalid or migration 0028 is unavailable.");
          }
          const sesBaseline = measurement.observations.find(item =>
            item?.observationKey === "ses:q4-social-2026:ga4:active_users:2026-07-31:2026-08-27"
          );
          if (
            !sesBaseline ||
            sesBaseline?.measurementPhase !== "baseline" ||
            sesBaseline?.sourceSystem !== "Google Analytics" ||
            sesBaseline?.metricKey !== "active_users" ||
            Number(sesBaseline?.metricValue) !== 840
          ) {
            throw new Error("SES Q4 Social Impact baseline observation from migration 0029 was not verified.");
          }
          console.log("PASS SES Q4 Social Impact baseline: 840 Google Analytics Active Users, Jul 31-Aug 27, 2026");

          const sesNewUsersBaseline = measurement.observations.find(item =>
            item?.observationKey === "ses:q4-social-2026:ga4:new_users:2026-07-31:2026-08-27"
          );
          if (
            !sesNewUsersBaseline ||
            sesNewUsersBaseline?.measurementPhase !== "baseline" ||
            sesNewUsersBaseline?.sourceSystem !== "Google Analytics" ||
            sesNewUsersBaseline?.metricKey !== "new_users" ||
            Number(sesNewUsersBaseline?.metricValue) !== 836
          ) {
            throw new Error("SES Q4 Social Impact New Users baseline observation from migration 0030 was not verified.");
          }
          console.log("PASS SES Q4 Social Impact baseline: 836 Google Analytics New Users, Jul 31-Aug 27, 2026");

          const sesEngagementBaseline = measurement.observations.find(item =>
            item?.observationKey === "ses:q4-social-2026:ga4:avg_engagement_time:2026-07-31:2026-08-27"
          );
          if (
            !sesEngagementBaseline ||
            sesEngagementBaseline?.measurementPhase !== "baseline" ||
            sesEngagementBaseline?.sourceSystem !== "Google Analytics" ||
            sesEngagementBaseline?.metricKey !== "avg_engagement_time" ||
            Number(sesEngagementBaseline?.metricValue) !== 76 ||
            sesEngagementBaseline?.metricUnit !== "seconds"
          ) {
            throw new Error("SES Q4 Social Impact engagement-time baseline observation from migration 0031 was not verified.");
          }
          console.log("PASS SES Q4 Social Impact baseline: 76 seconds Google Analytics Avg Engagement Time, Jul 31-Aug 27, 2026");

          const sesEventsBaseline = measurement.observations.find(item =>
            item?.observationKey === "ses:q4-social-2026:ga4:events:2026-07-31:2026-08-27"
          );
          if (
            !sesEventsBaseline ||
            sesEventsBaseline?.measurementPhase !== "baseline" ||
            sesEventsBaseline?.sourceSystem !== "Google Analytics" ||
            sesEventsBaseline?.metricKey !== "events" ||
            Number(sesEventsBaseline?.metricValue) !== 8000 ||
            sesEventsBaseline?.metricUnit !== "count"
          ) {
            throw new Error("SES Q4 Social Impact Events baseline observation from migration 0032 was not verified.");
          }
          console.log("PASS SES Q4 Social Impact baseline: 8000 Google Analytics Events, Jul 31-Aug 27, 2026");

          const sesProtectPageViewsBaseline = measurement.observations.find(item =>
            item?.observationKey === "ses:q4-social-2026:ga4:page_views:protect-page:2026-07-31:2026-08-27"
          );
          if (
            !sesProtectPageViewsBaseline ||
            sesProtectPageViewsBaseline?.measurementPhase !== "baseline" ||
            sesProtectPageViewsBaseline?.sourceSystem !== "Google Analytics" ||
            sesProtectPageViewsBaseline?.metricKey !== "page_views" ||
            Number(sesProtectPageViewsBaseline?.metricValue) !== 187 ||
            sesProtectPageViewsBaseline?.metricUnit !== "count"
          ) {
            throw new Error("SES Q4 Social Impact page-views baseline observation from migration 0033 was not verified.");
          }
          console.log("PASS SES Q4 Social Impact baseline: 187 Google Analytics Page Views for Protect page/screen, Jul 31-Aug 27, 2026");

          const sesLincolnPageViewsBaseline = measurement.observations.find(item =>
            item?.observationKey === "ses:q4-social-2026:ga4:page_views:lincoln-series:2026-07-31:2026-08-27"
          );
          if (
            !sesLincolnPageViewsBaseline ||
            sesLincolnPageViewsBaseline?.measurementPhase !== "baseline" ||
            sesLincolnPageViewsBaseline?.sourceSystem !== "Google Analytics" ||
            sesLincolnPageViewsBaseline?.metricKey !== "page_views" ||
            Number(sesLincolnPageViewsBaseline?.metricValue) !== 223 ||
            sesLincolnPageViewsBaseline?.metricUnit !== "count"
          ) {
            throw new Error("SES Q4 Social Impact Lincoln page-views baseline observation from migration 0034 was not verified.");
          }
          console.log("PASS SES Q4 Social Impact baseline: 223 Google Analytics Page Views for Liberty Safe Lincoln Series, Jul 31-Aug 27, 2026");

          const sesCenturion24PageViewsBaseline = measurement.observations.find(item =>
            item?.observationKey === "ses:q4-social-2026:ga4:page_views:centurion-24-premium-colors:2026-07-31:2026-08-27"
          );
          if (
            !sesCenturion24PageViewsBaseline ||
            sesCenturion24PageViewsBaseline?.measurementPhase !== "baseline" ||
            sesCenturion24PageViewsBaseline?.sourceSystem !== "Google Analytics" ||
            sesCenturion24PageViewsBaseline?.metricKey !== "page_views" ||
            Number(sesCenturion24PageViewsBaseline?.metricValue) !== 195 ||
            sesCenturion24PageViewsBaseline?.metricUnit !== "count"
          ) {
            throw new Error("SES Q4 Social Impact Centurion 24 page-views baseline observation from migration 0035 was not verified.");
          }
          console.log("PASS SES Q4 Social Impact baseline: 195 Google Analytics Page Views for Liberty Centurion 24 Premium Colors, Jul 31-Aug 27, 2026");

          const sesLargeGunSafesPageViewsBaseline = measurement.observations.find(item =>
            item?.observationKey === "ses:q4-social-2026:ga4:page_views:large-gun-safes-florida:2026-07-31:2026-08-27"
          );
          if (
            !sesLargeGunSafesPageViewsBaseline ||
            sesLargeGunSafesPageViewsBaseline?.measurementPhase !== "baseline" ||
            sesLargeGunSafesPageViewsBaseline?.sourceSystem !== "Google Analytics" ||
            sesLargeGunSafesPageViewsBaseline?.metricKey !== "page_views" ||
            Number(sesLargeGunSafesPageViewsBaseline?.metricValue) !== 129 ||
            sesLargeGunSafesPageViewsBaseline?.metricUnit !== "count"
          ) {
            throw new Error("SES Q4 Social Impact Large Gun Safes page-views baseline observation from migration 0036 was not verified.");
          }
          console.log("PASS SES Q4 Social Impact baseline: 129 Google Analytics Page Views for Large Gun Safes for Sale in Florida, Jul 31-Aug 27, 2026");

          const mediaWorkflowResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"get-media-operations", operation:"get_creative_workflow" })
          });
          if (!mediaWorkflowResponse.ok) {
            throw new Error(`Media creative workflow returned HTTP ${mediaWorkflowResponse.status}`);
          }
          const mediaWorkflow = await mediaWorkflowResponse.json();
          if (mediaWorkflow?.mediaCreativeWorkflowVersion !== "1.1.1") {
            throw new Error(`Expected Media Creative Workflow 1.1.1, received ${mediaWorkflow?.mediaCreativeWorkflowVersion || "unknown"}`);
          }
          if (!Array.isArray(mediaWorkflow?.creativeWorkflow?.productionSessions)) {
            throw new Error("Media production sessions are not live; migration 0011 may be unavailable.");
          }
          if (!Array.isArray(mediaWorkflow?.creativeWorkflow?.productionSessionCreatives)) {
            throw new Error("Media production-session creative links are not live.");
          }

          const mediaSessionBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"get-media-operations", operation:"save_production_session" })
          });
          if (mediaSessionBoundaryResponse.status !== 400) {
            throw new Error(`Media production session boundary expected HTTP 400 without clientId, received ${mediaSessionBoundaryResponse.status}`);
          }
          const mediaSessionBoundary = await mediaSessionBoundaryResponse.json();
          if (!String(mediaSessionBoundary?.error || "").toLowerCase().includes("clientid")) {
            throw new Error("Media production session route did not return the expected clientId validation boundary.");
          }

          const missionResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"get-mission-control" })
          });
          if (!missionResponse.ok) {
            throw new Error(`Mission Control returned HTTP ${missionResponse.status}`);
          }
          const mission = await missionResponse.json();
          const workAttention = mission?.missionControl?.navAttention?.sections?.work;
          if (workAttention?.supported !== true) {
            throw new Error("Mission Control does not recognize a durable Work deadline source.");
          }
          const dueDateSource = Array.isArray(workAttention?.supportedSources)
            && workAttention.supportedSources.some(source =>
              source?.table === "work_items" && source?.dateColumn === "due_date"
            );
          if (!dueDateSource) {
            throw new Error("Mission Control does not see work_items.due_date after migration.");
          }

          const mediaAttention = mission?.missionControl?.navAttention?.sections?.media;
          const mediaSessionSource = Array.isArray(mediaAttention?.supportedSources)
            && mediaAttention.supportedSources.some(source =>
              source?.table === "media_production_sessions"
              && source?.dateColumn === "scheduled_at"
            );
          if (!mediaSessionSource) {
            throw new Error("Mission Control does not recognize media_production_sessions.scheduled_at as a Media deadline source.");
          }

          const findingBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"save-email-intake-finding" })
          });
          if (findingBoundaryResponse.status !== 400) {
            throw new Error(`Signal Finding boundary expected HTTP 400 without intakeId, received ${findingBoundaryResponse.status}`);
          }

          for (const action of [
            "evaluate-gmail-work-request",
            "delete-gmail-no-action",
            "save-gmail-information"
          ]) {
            const response = await fetch(url, {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body:JSON.stringify({ action })
            });
            if (response.status !== 400) {
              throw new Error(`${action} route boundary expected HTTP 400 without gmailMessageId, received ${response.status}`);
            }
            const payload = await response.json();
            if (!String(payload?.error || "").includes("gmailMessageId")) {
              throw new Error(`${action} route did not return the expected validation boundary.`);
            }
          }

          const protectedResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"list-operating-sessions" })
          });
          if (protectedResponse.status !== 401) {
            throw new Error(`Expected authentication boundary HTTP 401, received ${protectedResponse.status}`);
          }
          console.log("PASS live Worker 7.39.0 with Schedule Operations 1.0.0 and Measurement Observations 1.0.0, plus existing production route boundaries");
          NODE
