# =========================================================
# Global Concepts Media Operating System
# File: .github/workflows/gcm-worker-deploy.yml
# Version: 1.4.8
# Status: Production Deployment Candidate
# Purpose: Test and deploy the GCM OS Cloudflare Worker from main.
# Change Notes:
# - Deploy Worker 7.19.6 with Client Health v2.2.2: evidence deduplication, recency-aware scoring, false-outcome rejection, and client-safe summaries.
# - LOCK: require Worker 7.19.6 and Prospect CRM 1.2.0 with durable Radar continuity.
# - Verify CRM D1 migrations are live by reading list_prospects and service catalog.
# - Verify the core business rule that a formal Prospect cannot be created
#   without a real scheduled appointment.
# - Verify service/startup route boundaries without creating test Prospect records.
# - Verify Media Production Sessions v1.1.1 and migration 0011 are live.
# - Verify Mission Control recognizes media_production_sessions as a Media deadline source.
# - Preserve Gmail operator-decision routes, Calendar, Work due-date source,
#   Operating Sessions, and auth boundaries.
# =========================================================

name: GCM Worker Deploy

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "routes/**"
      - "shared/**"
      - "wrangler.toml"
      - "package.json"
      - "migrations/**"
      - ".github/workflows/gcm-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcm-production-worker
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Production Tests
        run: npm test

      - name: Apply Additive D1 Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.122.0"
          command: d1 migrations apply DB --remote

      - name: Validate OpenAI Service Key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          node <<'NODE'
          const response = await fetch("https://api.openai.com/v1/models/gpt-5.4", {
            headers:{ Authorization:`Bearer ${process.env.OPENAI_API_KEY}` }
          });
          if(!response.ok){
            const payload=await response.json().catch(()=>({}));
            throw new Error(`OpenAI service key/model check failed: ${payload?.error?.message||`HTTP ${response.status}`}`);
          }
          console.log("PASS OpenAI service key and gpt-5.4 model access");
          NODE

      - name: Deploy GCM Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.122.0"
          command: deploy

      - name: Verify Live OS 2.0 Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const url = process.env.WORKER_URL;
          const healthResponse = await fetch(url);
          if (!healthResponse.ok) throw new Error(`Worker health returned HTTP ${healthResponse.status}`);
          const health = await healthResponse.json();
          if (health.workerFileVersion !== "7.19.6") {
            throw new Error(`Expected Worker 7.19.6, received ${health.workerFileVersion || "unknown"}`);
          }
          const requiredActions = [
            "prospect-crm",
            "calendar-operations",
            "evaluate-gmail-work-request",
            "approve-gmail-work-request",
            "delete-gmail-no-action",
            "save-gmail-information",
            "prepare-operating-session",
            "list-operating-sessions",
            "get-operating-session",
            "create-operating-session",
            "add-operating-session-evidence",
            "add-operating-session-entry",
            "update-operating-session-status"
          ];
          for (const action of requiredActions) {
            if (!health.actions?.includes(action)) throw new Error(`Live Worker is missing ${action}`);
          }

          const crmResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"list_prospects" })
          });
          if (!crmResponse.ok) {
            throw new Error(`Prospect CRM list returned HTTP ${crmResponse.status}`);
          }
          const crm = await crmResponse.json();
          if (crm?.ok !== true || !Array.isArray(crm?.prospects)) {
            throw new Error("Prospect CRM live read contract is invalid or D1 migration is unavailable.");
          }

          const serviceCatalogResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"list_service_catalog" })
          });
          if (!serviceCatalogResponse.ok) {
            throw new Error(`Prospect CRM service catalog returned HTTP ${serviceCatalogResponse.status}`);
          }
          const serviceCatalog = await serviceCatalogResponse.json();
          if (serviceCatalog?.prospectCrmVersion !== "1.2.0") {
            throw new Error(`Expected Prospect CRM 1.2.0, received ${serviceCatalog?.prospectCrmVersion || "unknown"}`);
          }
          const requiredServices = ["website_rebuild", "seo_search_visibility", "analytics_measurement", "consulting_agency_of_record"];
          for (const serviceKey of requiredServices) {
            if (!serviceCatalog?.services?.some(service => service?.key === serviceKey)) {
              throw new Error(`Prospect CRM service catalog is missing ${serviceKey}`);
            }
          }

          const startupBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"get_startup_package" })
          });
          if (startupBoundaryResponse.status !== 400) {
            throw new Error(`Startup package boundary expected HTTP 400 without prospectId, received ${startupBoundaryResponse.status}`);
          }

          const radarResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"list_radar" })
          });
          if (!radarResponse.ok) {
            throw new Error(`Prospect Radar list returned HTTP ${radarResponse.status}; Radar continuity migration may be unavailable.`);
          }
          const radar = await radarResponse.json();
          if (radar?.prospectCrmVersion !== "1.2.0" || !Array.isArray(radar?.radar)) {
            throw new Error("Prospect Radar live read contract is invalid or Radar continuity migration is unavailable.");
          }

          const radarDetailBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"prospect-crm", operation:"get_radar", radarId:2147483647 })
          });
          if (radarDetailBoundaryResponse.status !== 404) {
            throw new Error(`Radar detail boundary expected HTTP 404 for a nonexistent record, received ${radarDetailBoundaryResponse.status}`);
          }
          const radarDetailBoundary = await radarDetailBoundaryResponse.json();
          if (radarDetailBoundary?.operation !== "get_radar") {
            throw new Error("Prospect CRM get_radar operation is not live.");
          }

          const appointmentBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
              action:"prospect-crm",
              operation:"create_prospect",
              businessName:"CRM appointment boundary test"
            })
          });
          if (appointmentBoundaryResponse.status !== 400) {
            throw new Error(`Prospect creation boundary expected HTTP 400 without appointmentAt, received ${appointmentBoundaryResponse.status}`);
          }
          const appointmentBoundary = await appointmentBoundaryResponse.json();
          if (!String(appointmentBoundary?.error || "").toLowerCase().includes("appointment")) {
            throw new Error("Prospect CRM did not enforce the real-appointment creation boundary.");
          }

          const calendarResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"calendar-operations", operation:"list" })
          });
          if (!calendarResponse.ok) {
            throw new Error(`Calendar Operations returned HTTP ${calendarResponse.status}`);
          }
          const calendar = await calendarResponse.json();
          if (calendar?.ok !== true || !Array.isArray(calendar?.calendarAppointments)) {
            throw new Error("Calendar Operations live read contract is invalid.");
          }

          const mediaWorkflowResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"get-media-operations", operation:"get_creative_workflow" })
          });
          if (!mediaWorkflowResponse.ok) {
            throw new Error(`Media creative workflow returned HTTP ${mediaWorkflowResponse.status}`);
          }
          const mediaWorkflow = await mediaWorkflowResponse.json();
          if (mediaWorkflow?.mediaCreativeWorkflowVersion !== "1.1.1") {
            throw new Error(`Expected Media Creative Workflow 1.1.1, received ${mediaWorkflow?.mediaCreativeWorkflowVersion || "unknown"}`);
          }
          if (!Array.isArray(mediaWorkflow?.creativeWorkflow?.productionSessions)) {
            throw new Error("Media production sessions are not live; migration 0011 may be unavailable.");
          }
          if (!Array.isArray(mediaWorkflow?.creativeWorkflow?.productionSessionCreatives)) {
            throw new Error("Media production-session creative links are not live.");
          }

          const mediaSessionBoundaryResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"get-media-operations", operation:"save_production_session" })
          });
          if (mediaSessionBoundaryResponse.status !== 400) {
            throw new Error(`Media production session boundary expected HTTP 400 without clientId, received ${mediaSessionBoundaryResponse.status}`);
          }
          const mediaSessionBoundary = await mediaSessionBoundaryResponse.json();
          if (!String(mediaSessionBoundary?.error || "").toLowerCase().includes("clientid")) {
            throw new Error("Media production session route did not return the expected clientId validation boundary.");
          }

          const missionResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"get-mission-control" })
          });
          if (!missionResponse.ok) {
            throw new Error(`Mission Control returned HTTP ${missionResponse.status}`);
          }
          const mission = await missionResponse.json();
          const workAttention = mission?.missionControl?.navAttention?.sections?.work;
          if (workAttention?.supported !== true) {
            throw new Error("Mission Control does not recognize a durable Work deadline source.");
          }
          const dueDateSource = Array.isArray(workAttention?.supportedSources)
            && workAttention.supportedSources.some(source =>
              source?.table === "work_items" && source?.dateColumn === "due_date"
            );
          if (!dueDateSource) {
            throw new Error("Mission Control does not see work_items.due_date after migration.");
          }

          const mediaAttention = mission?.missionControl?.navAttention?.sections?.media;
          const mediaSessionSource = Array.isArray(mediaAttention?.supportedSources)
            && mediaAttention.supportedSources.some(source =>
              source?.table === "media_production_sessions"
              && source?.dateColumn === "scheduled_at"
            );
          if (!mediaSessionSource) {
            throw new Error("Mission Control does not recognize media_production_sessions.scheduled_at as a Media deadline source.");
          }

          for (const action of [
            "evaluate-gmail-work-request",
            "delete-gmail-no-action",
            "save-gmail-information"
          ]) {
            const response = await fetch(url, {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body:JSON.stringify({ action })
            });
            if (response.status !== 400) {
              throw new Error(`${action} route boundary expected HTTP 400 without gmailMessageId, received ${response.status}`);
            }
            const payload = await response.json();
            if (!String(payload?.error || "").includes("gmailMessageId")) {
              throw new Error(`${action} route did not return the expected validation boundary.`);
            }
          }

          const protectedResponse = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"list-operating-sessions" })
          });
          if (protectedResponse.status !== 401) {
            throw new Error(`Expected authentication boundary HTTP 401, received ${protectedResponse.status}`);
          }
          console.log("PASS live Worker 7.19.6, Prospect CRM 1.2.0, durable Radar intelligence/outreach continuity, service startup catalog, appointment boundary, Gmail decision routes, Calendar, Work due-date source, Operating Sessions, and authentication boundary");
          NODE
