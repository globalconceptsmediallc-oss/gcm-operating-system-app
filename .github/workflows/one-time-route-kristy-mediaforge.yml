name: One-Time Route Kristy MediaForge Request

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-route-kristy-mediaforge.yml"

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Route Kristy MediaForge request as GCM Requested Work
        shell: bash
        run: |
          node <<'NODE'
          const response=await fetch("https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
              action:"route-gmail-disposition",
              gmailMessageId:"1a0627fac7d3754d",
              gmailThreadId:"1a0627fac7d3754d",
              disposition:"requested_work",
              clientCode:"GCM"
            })
          });
          const data=await response.json();
          console.log("KRISTY_MEDIAFORGE_ROUTE",JSON.stringify(data));
          if(!response.ok||data?.ok!==true) throw new Error(data?.error||`HTTP ${response.status}`);
          NODE
