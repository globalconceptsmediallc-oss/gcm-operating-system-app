# =========================================================
# Global Concepts Media Operating System
# File: .github/workflows/prospect-radar-edit-install.yml
# Version: 1.0.1
# Status: One-Time Production Installer
# Purpose: Install direct Radar editing without rerunning intelligence.
# =========================================================

name: Prospect Radar Direct Edit Install

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prospect-radar-edit-install.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Prospect CRM and Prospects UI
        run: python scripts/install-prospect-radar-edit.py

      - name: Install Dependencies
        run: npm install

      - name: Run Production Tests
        run: npm test

      - name: Validate Patch
        run: git diff --check

      - name: Commit Installed Application Files
        run: |
          git config user.name "globalconceptsmediallc-oss"
          git config user.email "globalconceptsmediallc@gmail.com"
          git add routes/prospectCrm.js prospects.html tests/prospectCrm.test.js tests/prospectNextActionUi.test.js
          if git diff --cached --quiet; then
            echo "No application changes to commit."
          else
            git commit -m "Add direct Radar record editing"
            git push origin HEAD:main
          fi
