# =========================================================
# Global Concepts Media Operating System
# File: .github/workflows/work-full-recovery-v1923.yml
# Version: 1.0.0
# Status: One-Time Production Recovery Installer
# Purpose: Restore the complete proven Work page from the last stable
#          pre-deep-link production commit, then publish it as Work v1.9.23.
# =========================================================

name: Work Full Recovery v1.9.23

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/work-full-recovery-v1923.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore stable Work page and stamp recovery version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          stable_commit = "d74cad5271e17c4aab5d93dbd59103250c02002b"
          stable = subprocess.check_output(
              ["git", "show", f"{stable_commit}:work.html"],
              text=True,
          )

          required = [
              "Version: 1.9.18",
              "Requested Work + WWPOWD Investigation · v1.9.18",
              "Requested work + WWPOWD investigation · Work v1.9.18",
          ]
          missing = [item for item in required if item not in stable]
          if missing:
              raise SystemExit(f"Stable Work source contract changed; refusing recovery: {missing}")

          stable = stable.replace("Version: 1.9.18", "Version: 1.9.23", 1)
          stable = stable.replace(
              "Source: Production work.html 1.9.17",
              "Source: Stable production work.html 1.9.18",
              1,
          )
          stable = stable.replace(
              "Sprint: Durable Investigation Progress",
              "Sprint: Work Queue Full Recovery",
              1,
          )
          stable = stable.replace(
              "   Audited changes:\n",
              "   Audited changes:\n"
              "   - v1.9.23 FULL RECOVERY restores the entire proven pre-deep-link Work page, not only load().\n"
              "   - Removes all Work-page changes introduced after the stable 1.9.18 production state.\n"
              "   - Preserves live D1 data, current Worker routes, Gmail fixes, Investigations, and Work Items.\n"
              "   - No D1 schema, production record, or Worker route is modified by this recovery.\n",
              1,
          )
          stable = stable.replace(
              "Requested Work + WWPOWD Investigation · v1.9.18",
              "Requested Work + WWPOWD Investigation · v1.9.23",
              1,
          )
          stable = stable.replace(
              "Requested work + WWPOWD investigation · Work v1.9.18",
              "Requested work + WWPOWD investigation · Work v1.9.23",
              1,
          )
          Path("work.html").write_text(stable)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          parts = [int(x) for x in str(package.get("version", "0.0.0")).split(".")]
          if len(parts) != 3:
              raise SystemExit("package.json version is not semver; refusing recovery")
          parts[2] += 1
          new_version = ".".join(map(str, parts))
          package["version"] = new_version
          package.setdefault("gcm", {})["fileVersion"] = new_version
          package["gcm"]["purpose"] = "Full Work Queue browser-lock recovery using the proven pre-deep-link production page."
          package["gcm"]["changeNotes"] = [
              "Restores the complete Work page from stable production Work 1.9.18 and publishes it as 1.9.23.",
              "Removes all post-1.9.18 Work page changes while retaining current live data and backend routes.",
              "Leaves Gmail fixes, D1 records, Investigations, Work Items, schemas, and Worker routes unchanged.",
              "Recovery target is Safari browser responsiveness before reintroducing deep-link behavior."
          ]
          package_path.write_text(json.dumps(package, indent=2) + "\n")
          PY

      - name: Parse Work inline JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('work.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(Boolean);
          for(const script of scripts)new Function(script);
          console.log(`Parsed ${scripts.length} inline Work script(s).`);
          NODE

      - name: Install Dependencies
        run: npm install

      - name: Run Production Tests
        run: npm test

      - name: Validate Recovery
        run: |
          grep -q 'Version: 1.9.23' work.html
          grep -q 'Work Queue Full Recovery' work.html
          if grep -q 'Loading ${requestedClientCode} requested record directly' work.html; then
            echo 'Target-first loading still present; refusing release.'
            exit 1
          fi
          git diff --check

      - name: Commit Recovered Application
        run: |
          git config user.name "globalconceptsmediallc-oss"
          git config user.email "globalconceptsmediallc@gmail.com"
          rm .github/workflows/work-full-recovery-v1923.yml
          git add work.html package.json .github/workflows/work-full-recovery-v1923.yml
          git commit -m "Restore full stable Work Queue as v1.9.23"
          git push origin HEAD:main
