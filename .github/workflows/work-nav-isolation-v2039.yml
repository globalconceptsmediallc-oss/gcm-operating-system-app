name: Work Navigation Isolation v2.0.39

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse Shared Shell JavaScript
        run: node --check shared/gcm-shell.js

      - name: Install Dependencies
        run: npm ci

      - name: Run Production Tests
        run: npm test

      - name: Report
        run: echo "Work navigation isolation workflow is valid. No production files are modified by this diagnostic workflow."
