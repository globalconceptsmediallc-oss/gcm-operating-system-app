name: One-Time SES Merchant Shopify Work

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-ses-merchant-shopify-work.yml"

permissions:
  contents: read

jobs:
  create-work:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create SES Merchant Center structural Work Item
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";
          const body = {
            action: "commit-operational-decision",
            clientCode: "SES",
            externalId: "gmail-thread:1a05a86dec35b734",
            occurredAt: "2026-09-01T01:13:03Z",
            direction: "incoming",
            owner: "Andrew",
            rawContent: "Google Merchant Center alert for account 5325664516 reported 4 products missing product price. Investigation confirmed Merchant Center is currently discovering products from https://sesafes.com/ every 24 hours with 53 products and no provided primary source. Shopify Google & YouTube is installed and active for Google Ads, but Merchant Center remains inactive. Merchant Center 5325664516 is shown as a sub-account and is not offered by Shopify for direct Merchant Center connection. Business Manager links 5325664516 to Global Concepts Media, but adding Shopify routes back to the same Shopify Google & YouTube setup.",
            decision: {
              source: "Gmail — Human Routing",
              communicationType: "Requested Work",
              title: "Merchant Center catalog sync blocked by SES sub-account structure",
              workTitle: "Resolve SES Merchant Center 5325664516 sub-account structure and connect Shopify catalog",
              workDescription: "Preserve Merchant Center account 5325664516 and its history. Resolve the sub-account/standalone eligibility blocker so the Southeast Safes Shopify Google & YouTube channel can connect to this Merchant Center account. Do not create or connect a replacement Merchant Center account. After the account structure is corrected, connect Shopify, confirm the full Shopify product catalog syncs to Merchant Center, then re-check the 4 missing-price products.",
              operationalSummary: "The repeated missing-price alert is a symptom of a larger catalog-source problem. Merchant Center is crawling sesafes.com and currently has 53 products, while Shopify is not connected to Merchant Center 5325664516. The SES Merchant Center account is a sub-account, which is the current blocker to direct Shopify catalog sync.",
              businessImpact: "Merchant Center is not receiving the full Southeast Safes Shopify catalog, limiting product coverage on Google and creating recurring product-data errors.",
              importance: "High",
              operationalPriority: "High",
              recommendedAction: "Resolve the Merchant Center sub-account structure while preserving account 5325664516, then connect Shopify and verify full catalog sync.",
              reasoning: "Google reprocessed the site after prior price work and the same 4 products still fail. Current Merchant Center data sources show website discovery only, while Shopify shows Merchant Center inactive. The issue is structural, not another individual product-price fix.",
              recommendedRoutes: {
                saveCommunication: true,
                createInvestigation: false,
                createWorkItem: true,
                replyRequired: false
              }
            }
          };
          const response = await fetch(url, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(body)
          });
          const data = await response.json();
          console.log("WORK_RESULT", JSON.stringify(data));
          if (!response.ok || data?.ok !== true) {
            throw new Error(data?.error || `HTTP ${response.status}`);
          }
          if (!data?.workItemId && !data?.duplicate) {
            throw new Error("Expected Work Item creation.");
          }
          NODE
