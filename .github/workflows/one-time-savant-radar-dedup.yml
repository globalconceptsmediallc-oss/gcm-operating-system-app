# GCM OS | One-time Savant Radar duplicate cleanup (safety audited)
# File: .github/workflows/one-time-savant-radar-dedup.yml
# Version: 1.0.0
# No schema migrations, Worker code changes, or cross-client writes.
# Requires exactly five matching records, all identical and with no referenced history.
# Creates a backup artifact BEFORE any DELETE. Must be removed after validation.
name: One-time Savant Radar duplicate cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-savant-radar-dedup.yml

permissions:
  contents: read

jobs:
  audit-backup-then-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage scoped safety audit and cleanup script
        shell: bash
        run: |
          cat > /tmp/savant-radar-cleanup.mjs <<'SCRIPT'
          import fs from "node:fs";
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const dbid="ce93408a-85ee-4103-88aa-cd4a12169305";
          if(!token||!account)throw new Error("Cloudflare credentials unavailable; no changes made");
          const endpoint="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database/"+dbid+"/query";
          async function query(sql,params=[]){
           const res=await fetch(endpoint,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({sql,params:params.map(String)})});
           const data=await res.json();
           if(!res.ok||data.success!==true||!Array.isArray(data.result)||data.result.some(x=>x.success!==true))throw new Error("Cloudflare D1 query failed: "+JSON.stringify(data.errors||[]));
           return data.result[0].results||[];
          }
          const fields=["entry_type","business_name","website","test_site_url","vertical","market","source_type","source_description","contact_name","contact_email","contact_phone","evidence_reference","notes","status","nurture_reason","nurture_trigger","last_outreach_at","next_action_title","next_action_due_date","promoted_prospect_id","promoted_at","archived_at"];
          function comparable(row){return fields.map(f=>String(row[f]??"").trim()).join("\u001e");}
          async function inspect(){
           const rows=await query("SELECT * FROM crm_prospect_radar WHERE lower(trim(business_name)) = ? AND archived_at IS NULL ORDER BY id ASC",["savant wealth management"]);
           if(rows.length!==5)throw new Error("Expected exactly five active Savant rows; found "+rows.length+"; no deletion");
           const ids=rows.map(x=>Number(x.id));
           if(ids.some(x=>!Number.isSafeInteger(x)||x<=0)||new Set(ids).size!==5)throw new Error("Unsafe IDs; no deletion");
           const fingerprint=comparable(rows[0]);
           for(const row of rows){
            if(comparable(row)!==fingerprint)throw new Error("Savant records have different CRM content; no deletion");
            if(String(row.status).toLowerCase()!=="radar"||row.last_outreach_at||row.promoted_prospect_id||row.archived_at)throw new Error("A Savant record has progressed or is archived; no deletion");
           }
           const referenced=await query("SELECT name, sql FROM sqlite_master WHERE type = 'table' AND lower(sql) LIKE '%references crm_prospect_radar%'");
           for(const tbl of referenced){
            const name=String(tbl.name||"");
            if(!/^[a-z_][a-z0-9_]*$/i.test(name))throw new Error("Unsafe table identifier");
            const fk=await query('PRAGMA foreign_key_list("'+name+'")');
            for(const ref of fk.filter(x=>String(x.table).toLowerCase()==="crm_prospect_radar")){
             const col=String(ref.from||"");
             if(!/^[a-z_][a-z0-9_]*$/i.test(col))throw new Error("Unsafe reference column");
             const marks=ids.map(()=>"?").join(",");
             const linked=await query('SELECT COUNT(*) AS n FROM "'+name+'" WHERE "'+col+'" IN ('+marks+')',ids);
             if(Number(linked[0]?.n||0)!==0)throw new Error("Linked history exists in "+name+"; no deletion");
            }
           }
           return {rows,ids,keepId:ids[0],deleteIds:ids.slice(1)};
          }
          const mode=process.env.MODE;
          if(mode==="audit"){
           const state=await inspect();
           const archive={purpose:"One-time Savant Wealth Management duplicate cleanup",backupDate:new Date().toISOString(),keepId:state.keepId,deleteIds:state.deleteIds,rows:state.rows};
           fs.writeFileSync("savant-radar-5-originals-backup.json",JSON.stringify(archive,null,2));
           console.log("AUDIT PASS: five identical unprogressed Radar rows; keeping ID "+state.keepId+"; backup contains all 5 rows. No writes.");
          }else if(mode==="delete"){
           const backup=JSON.parse(fs.readFileSync("savant-radar-5-originals-backup.json","utf8"));
           const state=await inspect();
           if(state.keepId!==backup.keepId||JSON.stringify(state.deleteIds)!==JSON.stringify(backup.deleteIds)||JSON.stringify(state.rows)!==JSON.stringify(backup.rows))throw new Error("Rows changed since backup; no deletion");
           const marks=state.deleteIds.map(()=>"?").join(",");
           const sql="DELETE FROM crm_prospect_radar WHERE id IN ("+marks+") AND lower(trim(business_name)) = ? AND status = 'radar' AND archived_at IS NULL AND last_outreach_at IS NULL AND promoted_prospect_id IS NULL RETURNING id";
           const deleted=await query(sql,[...state.deleteIds,"savant wealth management"]);
           const removed=deleted.map(x=>Number(x.id)).sort((a,b)=>a-b);
           if(removed.length!==4||JSON.stringify(removed)!==JSON.stringify([...state.deleteIds].sort((a,b)=>a-b)))throw new Error("Unexpected affected rows; review immediately; "+JSON.stringify(removed));
           const remaining=await query("SELECT id FROM crm_prospect_radar WHERE lower(trim(business_name)) = ? AND archived_at IS NULL",["savant wealth management"]);
           if(remaining.length!==1||Number(remaining[0].id)!==state.keepId)throw new Error("Post-delete verification failed");
           console.log("DELETE VERIFIED: exactly 4 duplicate Savant rows removed; survivor ID "+state.keepId+"; all other records untouched.");
          }else{throw new Error("Unsupported mode");}
          SCRIPT

      - name: Audit live D1 records and create pre-delete backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: audit
        run: node /tmp/savant-radar-cleanup.mjs

      - name: Preserve original five records as recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: savant-radar-precleanup-records
          path: savant-radar-5-originals-backup.json
          if-no-files-found: error
          retention-days: 30

      - name: Delete exactly four audited duplicates and verify remaining one
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: delete
        run: node /tmp/savant-radar-cleanup.mjs
