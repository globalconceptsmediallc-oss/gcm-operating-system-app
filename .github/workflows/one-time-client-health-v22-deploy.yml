name: One-Time Client Health v2.2 Deploy

on:
  push:
    paths:
      - ".github/workflows/one-time-client-health-v22-deploy.yml"

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Production Tests
        run: npm test

      - name: Deploy GCM Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.122.0"
          command: deploy

      - name: Verify live Client Health v2.2
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";

          for (const clientCode of ["A1","SES"]) {
            const response = await fetch(url, {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body:JSON.stringify({ action:"get-client-workspace", clientCode })
            });
            const data = await response.json();
            if (!response.ok || data?.ok !== true) {
              throw new Error(data?.error || `HTTP ${response.status}`);
            }
            const h = data?.record?.clientHealthV2;
            if (h?.version !== "2.2.0") {
              throw new Error(`${clientCode} expected Client Health 2.2.0, got ${h?.version || "missing"}`);
            }
            console.log(`${clientCode}_HEALTH`, JSON.stringify({
              score:h.score,
              status:h.status,
              trend:h.trend,
              confidence:h.confidence,
              confidenceScore:h.confidenceScore,
              evidenceCoverage:h.evidenceCoverage,
              dimensions:h.dimensions.map(d=>({
                key:d.key,
                score:d.score,
                status:d.status,
                trend:d.trend,
                confidence:d.confidence,
                evidenceCount:d.evidenceCount,
                recentEvidenceCount:d.recentEvidenceCount,
                reason:d.reason,
                primaryEvidence:d.primaryEvidence
              })),
              whatIsWorking:h.whatIsWorking,
              needsAttention:h.needsAttention,
              highestValueMove:h.highestValueMove,
              whatWeAreWatching:h.whatWeAreWatching
            }));
          }
          NODE
