name: Curri final image repair

on:
  push:
    paths:
      - '.github/workflows/curri-final-assets.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build verified binary WebPs
        run: |
          set -euo pipefail

          cat \
            temp/curri-final/lib.00.b64 \
            temp/curri-final2/lib.01.b64 \
            temp/curri-final2/lib.02.b64 \
            temp/curri-final2/lib.03.b64 \
            temp/curri-final2/lib.04.b64 \
            temp/curri-final2/lib.05.b64 \
            temp/curri-final2/lib.06.b64 \
            temp/curri-final2/lib.07.b64 \
            temp/curri-final2/lib.08.b64 \
            | base64 -d > prospect-previews/john-curri/assets/curri-library-concept.webp

          cat \
            temp/curri-post-final/post.00.b64 \
            temp/curri-post-final/post.01.b64 \
            temp/curri-post-final/rem.00.b64 \
            temp/curri-post-final/rem.01.b64 \
            temp/curri-post-final/rem.02.b64 \
            temp/curri-post-final/rem.03.b64 \
            temp/curri-post-final/rem.04.b64 \
            temp/curri-post-final/rem.05.b64 \
            temp/curri-post-final/rem.06.b64 \
            | base64 -d > prospect-previews/john-curri/assets/curri-postcard-concept.webp

          test "$(stat -c%s prospect-previews/john-curri/assets/curri-library-concept.webp)" -eq 79680
          test "$(stat -c%s prospect-previews/john-curri/assets/curri-postcard-concept.webp)" -eq 71536

          python3 - <<'PY'
          from pathlib import Path
          expected = {
              Path('prospect-previews/john-curri/assets/curri-library-concept.webp'): 79680,
              Path('prospect-previews/john-curri/assets/curri-postcard-concept.webp'): 71536,
          }
          for p, size in expected.items():
              b = p.read_bytes()
              assert len(b) == size, (p, len(b), size)
              assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', f'{p} is not a valid WebP'
              print('verified', p, len(b), 'bytes')
          PY

      - name: Update Curri concept page
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('prospect-previews/john-curri/index.html')
          text = path.read_text()

          text = text.replace('Version: 1.1.8', 'Version: 1.2.0', 1)
          text = text.replace(
              'Change Notes — 1.1.8:',
              'Change Notes — 1.2.0:\n'
              '   - Replaces the Section 02 previews with verified, genuine binary WebP files.\n'
              '   - Uses the exact Luxury Waterfront Property Marketing Flyer artwork from the Curri Image Library for the digital extension.\n'
              '   - Uses the sharp horizontal Curri postcard concept for the direct-mail preview.\n'
              '   - Removes the low-quality preview assets and Base64 staging files after the verified binary assets are built.\n'
              '   - Preserves the lead form, page layout and engagement tracking.\n\n'
              '   Change Notes — 1.1.8:',
              1
          )

          text = text.replace('assets/postcard-concept.webp?v=117', 'assets/curri-postcard-concept.webp?v=120')
          text = text.replace('assets/social-concept.webp?v=117', 'assets/curri-library-concept.webp?v=120')
          text = text.replace('assets/postcard-concept.webp?v=118', 'assets/curri-postcard-concept.webp?v=120')
          text = text.replace('assets/social-concept.webp?v=118', 'assets/curri-library-concept.webp?v=120')
          text = text.replace('assets/curri-concept-hq.webp?v=119', 'assets/curri-library-concept.webp?v=120')

          # Section 04 in v1.1.8 uses the restored Curri concept artwork. If it still
          # points at any obsolete Curri concept preview, move it to the exact library asset.
          for old in (
              'assets/original-curri-concept.webp',
              'assets/curri-original-concept.webp',
              'assets/curri-concept.webp',
          ):
              text = text.replace(old, 'assets/curri-library-concept.webp?v=120')

          text = text.replace('.evidence img,.asset img{display:block;width:100%;', '.evidence img,.asset img{display:block;width:100%;height:auto;', 1)
          text = text.replace('Concept preview only · Version 1.1.8', 'Concept preview only · Version 1.2.0')
          text = text.replace('const FILE_VERSION="1.1.8"', 'const FILE_VERSION="1.2.0"')
          text = text.replace('const FILE_VERSION = "1.1.8"', 'const FILE_VERSION = "1.2.0"')

          # Hard fail if Section 02 still contains either obsolete low-quality asset.
          assert 'assets/postcard-concept.webp?v=117' not in text
          assert 'assets/social-concept.webp?v=117' not in text
          assert 'assets/curri-postcard-concept.webp?v=120' in text
          assert 'assets/curri-library-concept.webp?v=120' in text
          assert 'Version: 1.2.0' in text

          path.write_text(text)
          PY

      - name: Remove obsolete Curri staging and preview assets
        run: |
          set -euo pipefail
          rm -f prospect-previews/john-curri/assets/postcard-concept.webp
          rm -f prospect-previews/john-curri/assets/social-concept.webp
          rm -f prospect-previews/john-curri/assets/curri-concept-hq.webp
          rm -rf temp/curri-final temp/curri-final2 temp/curri-hq temp/curri-hq2 temp/curri-q62 temp/curri-post-final .curri-repair
          rm -f .github/workflows/curri-hq-assets.yml
          rm -f .github/workflows/curri-final-assets.yml

      - name: Verify final references and commit
        run: |
          set -euo pipefail
          grep -q 'Version: 1.2.0' prospect-previews/john-curri/index.html
          grep -q 'assets/curri-postcard-concept.webp?v=120' prospect-previews/john-curri/index.html
          grep -q 'assets/curri-library-concept.webp?v=120' prospect-previews/john-curri/index.html
          test "$(stat -c%s prospect-previews/john-curri/assets/curri-library-concept.webp)" -eq 79680
          test "$(stat -c%s prospect-previews/john-curri/assets/curri-postcard-concept.webp)" -eq 71536

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use verified sharp Curri library artwork"
          git push
