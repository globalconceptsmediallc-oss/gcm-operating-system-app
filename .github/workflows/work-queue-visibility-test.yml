name: Work Queue Visibility Test

on:
  push:
    branches:
      - fix/work-queue-visibility-20260826

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch Work queue visibility
        run: python .github/scripts/patch-work-queue.py

      - name: Install dependencies
        run: npm install

      - name: Run full production tests
        run: npm test

      - name: Commit tested production file
        shell: bash
        run: |
          git config user.name "globalconceptsmediallc-oss"
          git config user.email "globalconceptsmediallc@gmail.com"
          git add work.html
          if git diff --cached --quiet; then
            echo "No Work page changes to commit."
            exit 0
          fi
          git commit -m "Keep all open Work Items visible"
          git push origin HEAD:fix/work-queue-visibility-20260826
