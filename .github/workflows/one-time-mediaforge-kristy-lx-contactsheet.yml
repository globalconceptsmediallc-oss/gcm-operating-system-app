name: One-Time MediaForge Kristy LX Contact Sheet

on:
  push:
    paths:
      - ".github/workflows/one-time-mediaforge-kristy-lx-contactsheet.yml"

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Reassemble source ZIPs
        shell: bash
        run: |
          mkdir -p /tmp/mediaforge
          cat temp/mediaforge-input/lx40/part-*.b64 | base64 -d > /tmp/mediaforge/lx40.zip
          cat temp/mediaforge-input/lx50/part-*.b64 | base64 -d > /tmp/mediaforge/lx50.zip

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Build contact sheets
        shell: bash
        run: |
          python <<'PY'
          import os, zipfile, io, math
          from PIL import Image, ImageDraw, ImageFont

          os.makedirs("/tmp/mediaforge/out", exist_ok=True)

          for label in ("lx40","lx50"):
              with zipfile.ZipFile(f"/tmp/mediaforge/{label}.zip") as z:
                  names=[n for n in z.namelist() if n.lower().endswith(".webp") and "-open-empty-" in n.lower()]
                  names.sort()

                  thumb_w, thumb_h = 360, 320
                  label_h = 80
                  cols = 3
                  rows = math.ceil(len(names)/cols)
                  sheet = Image.new("RGB",(cols*thumb_w, rows*(thumb_h+label_h)),"white")
                  draw = ImageDraw.Draw(sheet)

                  for idx,name in enumerate(names):
                      raw=z.read(name)
                      im=Image.open(io.BytesIO(raw)).convert("RGB")
                      im.thumbnail((thumb_w-20,thumb_h-20))
                      x=(idx%cols)*thumb_w + (thumb_w-im.width)//2
                      y=(idx//cols)*(thumb_h+label_h) + (thumb_h-im.height)//2
                      sheet.paste(im,(x,y))
                      short=os.path.basename(name)
                      short=short.replace(f"LX-Sig-{label[2:]}-","")
                      short=short.replace("-Open-Empty-ProFlex.copy-interior.webp","")
                      short=short.replace("-Open-Empty-ProFlex-interior.webp","")
                      ty=(idx//cols)*(thumb_h+label_h)+thumb_h+5
                      draw.text(((idx%cols)*thumb_w+10,ty),short,fill="black")

                  sheet.save(f"/tmp/mediaforge/out/{label}-empty-contact-sheet.jpg",quality=90)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kristy-lx-contact-sheets
          path: /tmp/mediaforge/out/*.jpg
