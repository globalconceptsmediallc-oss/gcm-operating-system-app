name: One-Time Read GCM Workspace

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-read-gcm-workspace.yml"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read GCM workspace
        shell: bash
        run: |
          node <<'NODE'
          const url="https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";
          const response=await fetch(url,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-client-workspace",clientCode:"GCM"})
          });
          const data=await response.json();
          console.log("GCM_WORKSPACE",JSON.stringify(data));
          if(!response.ok||data?.ok!==true) throw new Error(data?.error||`HTTP ${response.status}`);
          NODE
