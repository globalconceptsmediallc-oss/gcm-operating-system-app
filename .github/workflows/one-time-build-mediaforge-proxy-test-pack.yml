name: One-Time Build MediaForge Proxy Test Pack

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-build-mediaforge-proxy-test-pack.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download public Liberty/Lincoln proxy images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mediaforge-proxy
          curl -L --fail --retry 3             'https://www.thesafekeeper.com/cdn/shop/products/IMG_2393.jpg?v=1651270061&width=640'             -o /tmp/mediaforge-proxy/empty.jpg
          curl -L --fail --retry 3             'https://deansafe.com/cdn/shop/files/Used_Liberty-Lincoln-25_8_1200x.jpg?v=1730488285'             -o /tmp/mediaforge-proxy/full-no-guns.jpg
          curl -L --fail --retry 3             'https://sesafes.com/cdn/shop/products/LX25-Traditional-Black-Gloss-CH-ML-open_d3c4906d-35d1-45eb-8ecc-5d7bf30c8b48_1200x.png?v=1658264287'             -o /tmp/mediaforge-proxy/loaded.png
          file /tmp/mediaforge-proxy/*

      - name: Build six-file MediaForge proxy batch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import csv, shutil, zipfile

          src = Path("/tmp/mediaforge-proxy")
          out = Path("mediaforge/downloads/mediaforge-kristy-lincoln25-proflex-proxy-test")
          out.mkdir(parents=True, exist_ok=True)

          source_map = {
              "empty": src / "empty.jpg",
              "full": src / "full-no-guns.jpg",
              "loaded": src / "loaded.png",
          }

          converted = {}
          for key, source in source_map.items():
              image = Image.open(source).convert("RGB")
              image.thumbnail((1200, 1200))
              canvas = Image.new("RGB", (1200, 1200), "white")
              x = (1200 - image.width) // 2
              y = (1200 - image.height) // 2
              canvas.paste(image, (x, y))
              target = src / f"{key}.webp"
              canvas.save(target, "WEBP", quality=82, method=6)
              converted[key] = target

          rows = [
              (
                  "LX25-Black Gloss(BV)-Open-Empty-Pro Flex-2026.webp",
                  "liberty-lincoln-25-20-black-gloss-bv-pro-flex-interior-empty.webp",
                  "empty",
                  21,
                  20,
              ),
              (
                  "LX25-Black Gloss(BV)-Open-ProFlex-Full No Guns-2026.webp",
                  "liberty-lincoln-25-20-black-gloss-bv-pro-flex-interior-full-no-guns.webp",
                  "full",
                  21,
                  20,
              ),
              (
                  "LX25-Black Gloss(BV)-Open-ProFlex-Loaded-2026.webp",
                  "liberty-lincoln-25-20-black-gloss-bv-pro-flex-interior-loaded.webp",
                  "loaded",
                  21,
                  20,
              ),
              (
                  "LX25-Black Gloss-Open-Empty-Pro Flex.copy.webp",
                  "liberty-lincoln-25-20-black-gloss-pro-flex-interior-empty.webp",
                  "empty",
                  20,
                  20,
              ),
              (
                  "LX25-Black Gloss-Open-ProFlex-Full No Guns-2026.webp",
                  "liberty-lincoln-25-20-black-gloss-pro-flex-interior-full-no-guns.webp",
                  "full",
                  20,
                  20,
              ),
              (
                  "LX25-Black Gloss-Open-ProFlex-Loaded-2026.webp",
                  "liberty-lincoln-25-20-black-gloss-pro-flex-interior-loaded.webp",
                  "loaded",
                  20,
                  20,
              ),
          ]

          for source_name, _, image_key, _, _ in rows:
              shutil.copyfile(converted[image_key], out / source_name)

          readme = out / "README-TEST-PROXY.txt"
          readme.write_text(
              "MediaForge Lincoln 25 Pro Flex proxy road-test batch\n\n"
              "These are NOT the exact Liberty Canto originals. They are public-web proxy "
              "images packaged under Kristy's six Canto-style source filenames so we can "
              "road-test MediaForge intake, parsing, interior-number inheritance, audit "
              "preview, and ZIP output before Canto access is restored.\n\n"
              "Do not use these proxy images as production product photography.\n",
              encoding="utf-8",
          )

          manifest = Path("mediaforge/downloads/mediaforge-kristy-lincoln25-proflex-proxy-test-manifest.csv")
          with manifest.open("w", newline="", encoding="utf-8") as fh:
              writer = csv.writer(fh)
              writer.writerow([
                  "source_filename",
                  "expected_mediaforge_filename",
                  "proxy_state",
                  "source_exterior_position",
                  "interior_representative_position",
                  "test_only",
              ])
              for source_name, expected, image_key, source_pos, interior_pos in rows:
                  writer.writerow([source_name, expected, image_key, source_pos, interior_pos, "YES"])

          zip_path = Path("mediaforge/downloads/mediaforge-kristy-lincoln25-proflex-proxy-test.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for source_name, *_ in rows:
                  zf.write(out / source_name, arcname=source_name)
              zf.write(readme, arcname=readme.name)

          print(f"Built {zip_path} ({zip_path.stat().st_size} bytes)")
          print(f"Built {manifest}")
          PY

      - name: Commit proxy test pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GCM OS Automation"
          git config user.email "globalconceptsmediallc@gmail.com"
          git add             mediaforge/downloads/mediaforge-kristy-lincoln25-proflex-proxy-test.zip             mediaforge/downloads/mediaforge-kristy-lincoln25-proflex-proxy-test-manifest.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add MediaForge Lincoln 25 proxy road-test pack"
          git push
