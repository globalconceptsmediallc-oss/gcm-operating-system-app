name: Curri remove unused Base64 assets

on:
  push:
    paths:
      - '.github/workflows/curri-clean-unused.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove obsolete Base64 files
        run: |
          set -euo pipefail
          rm -f prospect-previews/john-curri/assets/*.b64.*
          rm -f .github/workflows/curri-clean-unused.yml
          ! grep -R "\.b64\." prospect-previews/john-curri/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete Curri Base64 assets"
          git push
