name: One-Time Client Health v2.1 Check

on:
  push:
    paths:
      - ".github/workflows/one-time-client-health-v21-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live A1 and SES Client Health v2.1
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";

          async function read(clientCode) {
            const response = await fetch(url, {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body:JSON.stringify({ action:"get-client-workspace", clientCode })
            });
            const data = await response.json();
            if (!response.ok || data?.ok !== true) {
              throw new Error(data?.error || `HTTP ${response.status}`);
            }

            const h = data?.record?.clientHealthV2 || null;
            console.log(`${clientCode}_HEALTH`, JSON.stringify({
              version:h?.version,
              score:h?.score,
              status:h?.status,
              trend:h?.trend,
              confidence:h?.confidence,
              confidenceScore:h?.confidenceScore,
              evidenceCoverage:h?.evidenceCoverage,
              dimensions:(h?.dimensions||[]).map(d=>({
                key:d.key,
                label:d.label,
                weight:d.weight,
                score:d.score,
                status:d.status,
                trend:d.trend,
                confidence:d.confidence,
                confidenceScore:d.confidenceScore,
                evidenceCount:d.evidenceCount,
                recentEvidenceCount:d.recentEvidenceCount,
                reason:d.reason,
                primaryEvidence:d.primaryEvidence
              })),
              whatIsWorking:h?.whatIsWorking,
              needsAttention:h?.needsAttention,
              highestValueMove:h?.highestValueMove,
              whatWeAreWatching:h?.whatWeAreWatching
            }));
          }

          await read("A1");
          await read("SES");
          NODE
