name: One-Time MediaForge LX40 Road Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-mediaforge-roadtest-lx40.yml"

permissions:
  contents: read

jobs:
  road-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble Kristy original LX40 ZIP
        shell: bash
        run: |
          mkdir -p /tmp/mediaforge
          cat temp/mediaforge-input/lx40/part-*.b64 | base64 -d > /tmp/mediaforge/lx40-original.zip
          unzip -t /tmp/mediaforge/lx40-original.zip

      - name: Verify exact original LX40 road-test result
        shell: bash
        run: |
          unzip -Z1 /tmp/mediaforge/lx40-original.zip | grep -Ei '\.(webp|png|jpe?g)$' > /tmp/mediaforge/original-names.txt
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            BUILTIN_PRESETS,
            inferFileRecord,
            buildProposedName,
            knownRenameException
          } from "./mediaforge/naming.js";

          const recipe = structuredClone(
            BUILTIN_PRESETS.find(item => item.id === "liberty-lincoln-signature-interiors")
          );
          const names = fs.readFileSync("/tmp/mediaforge/original-names.txt","utf8")
            .trim().split(/\r?\n/).filter(Boolean);

          const rows = names.map(name => {
            const simple = name.split("/").pop();
            const parsed = inferFileRecord(simple);
            const result = buildProposedName(recipe, parsed);
            const exception = knownRenameException(recipe, parsed, result);
            return {
              name:simple,
              ready:result.ready,
              exception:exception?.label || null,
              blocked:!result.ready && !exception,
              changed:result.ready && result.filename !== simple,
              output:result.filename
            };
          });

          const summary = {
            found:rows.length,
            ready:rows.filter(row => row.ready).length,
            review:rows.filter(row => row.exception).length,
            blocked:rows.filter(row => row.blocked).length,
            willChange:rows.filter(row => row.changed).length,
            exceptions:[...new Set(rows.filter(row => row.exception).map(row => row.exception))]
          };
          console.log("ORIGINAL_LX40", JSON.stringify(summary));

          if (
            summary.found !== 45 ||
            summary.ready !== 42 ||
            summary.review !== 3 ||
            summary.blocked !== 0 ||
            summary.willChange !== 42 ||
            summary.exceptions.join(",") !== "Textured Bronze"
          ) {
            throw new Error("Original LX40 road-test contract failed: "+JSON.stringify(summary));
          }
          NODE

      - name: Verify exact already-renamed LX40 road-test result
        shell: bash
        run: |
          unzip -Z1 mediaforge/downloads/kristy-lincoln-40-signature-interiors-renamed.zip | grep -Ei '\.(webp|png|jpe?g)$' > /tmp/mediaforge/verified-names.txt
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            BUILTIN_PRESETS,
            inferFileRecord,
            buildProposedName,
            knownRenameException
          } from "./mediaforge/naming.js";

          const recipe = structuredClone(
            BUILTIN_PRESETS.find(item => item.id === "liberty-lincoln-signature-interiors")
          );
          const names = fs.readFileSync("/tmp/mediaforge/verified-names.txt","utf8")
            .trim().split(/\r?\n/).filter(Boolean);

          const rows = names.map(name => {
            const simple = name.split("/").pop();
            const parsed = inferFileRecord(simple);
            const result = buildProposedName(recipe, parsed);
            const exception = knownRenameException(recipe, parsed, result);
            return {
              name:simple,
              ready:result.ready,
              exception:exception?.label || null,
              blocked:!result.ready && !exception,
              changed:result.ready && result.filename !== simple
            };
          });

          const summary = {
            found:rows.length,
            ready:rows.filter(row => row.ready).length,
            review:rows.filter(row => row.exception).length,
            blocked:rows.filter(row => row.blocked).length,
            willChange:rows.filter(row => row.changed).length
          };
          console.log("VERIFIED_LX40", JSON.stringify(summary));

          if (
            summary.found !== 42 ||
            summary.ready !== 42 ||
            summary.review !== 0 ||
            summary.blocked !== 0 ||
            summary.willChange !== 0
          ) {
            throw new Error("Verified LX40 road-test contract failed: "+JSON.stringify(summary));
          }
          NODE
