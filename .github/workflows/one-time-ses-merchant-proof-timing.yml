name: One-Time SES Merchant Proof Timing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-ses-merchant-proof-timing.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect SES Merchant Center proof timing
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";
          const response = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"get-client-workspace", clientCode:"SES" })
          });
          const data = await response.json();
          if (!response.ok || data?.ok !== true) throw new Error(data?.error || `HTTP ${response.status}`);
          const record=data?.record||{};
          const pools={
            proofOfWork:record?.proofOfWork||[],
            activityRecords:record?.activityRecords||[],
            workItems:record?.operational?.workItems||[],
            investigations:record?.operational?.investigations||[],
            communications:record?.communications||[],
            intelligence:record?.intelligence||[]
          };
          const rx=/merchant|missing product price|product price|google shopping|shopping/i;
          for (const [name,items] of Object.entries(pools)){
            const matches=items.filter(item=>rx.test(JSON.stringify(item)));
            if(matches.length) console.log(name.toUpperCase(), JSON.stringify(matches));
          }
          NODE
