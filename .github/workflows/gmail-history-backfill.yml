# =========================================================
# GCM OS — Record SES Semrush position monitoring
# Authorized operational action: 2026-08-29
# =========================================================
name: Record SES Position Monitoring

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install wrangler@4.122.0

      - name: Build D1 update
        run: |
          cat > /tmp/record-ses-position-monitoring.sql <<'SQL'
          INSERT INTO activity_records (
            client_id,
            activity_date,
            category,
            activity,
            evidence_type,
            evidence_reference,
            status,
            owner,
            expected_impact,
            actual_impact,
            notes,
            source_type,
            source_reference
          )
          SELECT
            c.id,
            '2026-08-29',
            'SEO Monitoring',
            'SEMrush Position Tracking alert — gun safe combination change melbourne fl moved outside top 10',
            'SEMrush Position Tracking',
            'gmail-thread:1a04a07eb5e59b99',
            'completed',
            'GCM',
            'Preserve ranking movement for trend analysis; escalate only if movement becomes material or persistent.',
            'Keyword ranked position 11 on Aug 29, 2026 after triggering the Leaves the top 10 rule. Reported search volume is 0. No client work is justified from this single low-volume one-position threshold crossing.',
            'Monitoring only. No investigation or work item created.',
            'gmail_monitoring',
            'gmail-thread:1a04a07eb5e59b99'
          FROM clients c
          WHERE c.client_code = 'SES'
            AND NOT EXISTS (
              SELECT 1 FROM activity_records ar
              WHERE ar.source_reference = 'gmail-thread:1a04a07eb5e59b99'
            );

          INSERT INTO gmail_monitoring_evidence (
            client_id,
            activity_record_id,
            source_type,
            source_reference,
            gmail_message_id,
            gmail_thread_id,
            source_subject,
            source_sender,
            source_date,
            source_content,
            structured_evidence_json,
            evidence_summary,
            status,
            created_at,
            updated_at
          )
          SELECT
            c.id,
            ar.id,
            'gmail',
            'gmail-thread:1a04a07eb5e59b99',
            '1a04a07eb5e59b99',
            '1a04a07eb5e59b99',
            'Notification of rank change. Project: sesafes.com',
            'Semrush Position Tracking <position-tracking-alerts@semrush.com>',
            'August 29, 2026',
            'Position Tracking Project: sesafes.com. Device & Location: Melbourne, Florida, United States (Google), English. Rule: Leaves the top 10. Keyword: gun safe combination change melbourne fl. Position on Aug 29: 11. Diff: 1. Volume: 0.',
            '{"type":"monitoring_evidence","project":"sesafes.com","device_location":"Melbourne, Florida, United States (Google)","rule":"Leaves the top 10","keyword":"gun safe combination change melbourne fl","position":11,"diff":1,"volume":0,"disposition":"monitoring_only"}',
            'SEMrush alert: gun safe combination change melbourne fl at position 11; one-position threshold crossing; search volume 0; monitoring only.',
            'monitoring_saved',
            CURRENT_TIMESTAMP,
            CURRENT_TIMESTAMP
          FROM clients c
          JOIN activity_records ar
            ON ar.client_id = c.id
           AND ar.source_reference = 'gmail-thread:1a04a07eb5e59b99'
          WHERE c.client_code = 'SES'
            AND NOT EXISTS (
              SELECT 1 FROM gmail_monitoring_evidence g
              WHERE g.source_reference = 'gmail-thread:1a04a07eb5e59b99'
            );
          SQL

      - name: Apply update to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file=/tmp/record-ses-position-monitoring.sql

      - name: Verify through production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute DB --remote --command="SELECT g.id, g.client_id, g.activity_record_id, g.source_subject, g.evidence_summary, g.status FROM gmail_monitoring_evidence g WHERE g.source_reference='gmail-thread:1a04a07eb5e59b99';"
