# =========================================================
# GCM OS — Read-only verification of SES radio traffic records
# No production writes
# =========================================================
name: Verify SES Radio Traffic Records

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install wrangler@4.122.0
      - name: Query production D1 read only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== MEDIA SCHEMA ==="
          npx wrangler d1 execute DB --remote --command="SELECT name, sql FROM sqlite_master WHERE type='table' AND name IN ('media_records','media_creatives','media_creative_assignments','media_traffic_packages','media_traffic_package_assignments','media_confirmation_evidence','media_confirmation_links');"
          echo "=== CREATIVES ==="
          npx wrangler d1 execute DB --remote --command="SELECT * FROM media_creatives WHERE creative_name LIKE '%Safe Moving Services 2%' OR creative_name LIKE '%Safe Repair Services 2%';"
          echo "=== ASSIGNMENTS ==="
          npx wrangler d1 execute DB --remote --command="SELECT a.* FROM media_creative_assignments a JOIN media_creatives c ON c.id=a.creative_id WHERE c.creative_name LIKE '%Safe Moving Services 2%' OR c.creative_name LIKE '%Safe Repair Services 2%' ORDER BY c.id,a.id;"
          echo "=== PACKAGES ==="
          npx wrangler d1 execute DB --remote --command="SELECT p.* FROM media_traffic_packages p JOIN media_creatives c ON c.id=p.creative_id WHERE c.creative_name LIKE '%Safe Moving Services 2%' OR c.creative_name LIKE '%Safe Repair Services 2%' ORDER BY c.id,p.id;"
          echo "=== CONFIRMATIONS ==="
          npx wrangler d1 execute DB --remote --command="SELECT * FROM media_confirmation_evidence WHERE gmail_thread_id IN ('1a044a593149b942','1a044921f5bde047') OR gmail_message_id IN ('1a04a45bab9d1341','1a04a460ea554d75');"
          echo "=== MEDIA RECORDS ==="
          npx wrangler d1 execute DB --remote --command="SELECT * FROM media_records WHERE campaign_name LIKE '%Safe Moving Services 2%' OR campaign_name LIKE '%Safe Repair Services 2%' OR creative_version LIKE '%SESLM2602%' OR creative_version LIKE '%SESLO2602%' ORDER BY id;" || true
