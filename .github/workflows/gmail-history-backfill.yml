# =========================================================
# GCM OS — Read-only Lincoln 25 Work lookup
# =========================================================
name: Lookup Lincoln 25 Work

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read SES work item
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const response=await fetch(process.env.WORKER_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-client-workspace",clientCode:"SES"})
          });
          const payload=await response.json();
          if(!response.ok||payload?.ok!==true) throw new Error(payload?.error||String(response.status));
          const items=(payload.operational?.workItems||[]).filter(w=>/Lincoln 25 Signature Renames/i.test(w.title||""));
          console.log("LINCOLN25="+JSON.stringify(items));
          NODE
