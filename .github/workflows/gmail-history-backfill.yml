# =========================================================
# GCM OS — Record SES Work Item #13 continued external validation
# Authorized operational action: 2026-08-29
# =========================================================
name: Record SES Work 13 Continued Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install wrangler@4.122.0

      - name: Build D1 progress update
        run: |
          cat > /tmp/record-ses-work13-validation.sql <<'SQL'
          UPDATE work_items
          SET
            description = description ||
              '\n\nCONTINUED EXTERNAL VALIDATION — 2026-08-29: Merchant Center still shows the same four Missing product price disapprovals. The Merchant Center Needs attention screen states the product data was last updated at 10:55 PM Aug 24, 2026, which predates the Aug 28 live validation work. No new product defect is supported by this screen. Continue awaiting Google reprocessing; do not change Shopify product data unless the issue remains after Merchant Center refreshes/reprocesses the feed.',
            updated_at = '2026-08-29 09:40:00'
          WHERE id = 13
            AND client_id = (SELECT id FROM clients WHERE client_code = 'SES' LIMIT 1)
            AND status = 'awaiting_external_validation'
            AND instr(COALESCE(description,''), 'CONTINUED EXTERNAL VALIDATION — 2026-08-29') = 0;

          INSERT INTO evidence (
            client_id,
            investigation_id,
            work_item_id,
            communication_id,
            evidence_type,
            source,
            description,
            url,
            captured_at
          )
          SELECT
            wi.client_id,
            wi.investigation_id,
            wi.id,
            wi.communication_id,
            'external_validation',
            'Google Merchant Center — Needs attention / Aug 29 email',
            'August 29, 2026 follow-up: Merchant Center still lists Liberty Safe Home SE, Liberty Safe Jewelry Drawers, Liberty Safe Desiccant Moisture Absorbers, and Liberty Safe Beast Vault Door Series as Not approved for Missing product price. The screen shows product data last updated at 10:55 PM Aug 24, 2026, before the Aug 28 live Merchant Listing verification that showed valid prices for all four exact variants. This supports continued stale/reprocessing state rather than a new Shopify defect. Keep Work Item #13 awaiting_external_validation and wait for Merchant Center refresh/reprocessing before any further product change.',
            NULL,
            '2026-08-29 09:40:00'
          FROM work_items wi
          WHERE wi.id = 13
            AND NOT EXISTS (
              SELECT 1 FROM evidence e
              WHERE e.work_item_id = 13
                AND e.evidence_type = 'external_validation'
                AND e.source = 'Google Merchant Center — Needs attention / Aug 29 email'
            );
          SQL

      - name: Apply update to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file=/tmp/record-ses-work13-validation.sql

      - name: Verify through production Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const r=await fetch(process.env.WORKER_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-client-workspace",clientCode:"SES"})
          });
          const p=await r.json();
          if(!r.ok||p?.ok!==true) throw new Error(p?.error||String(r.status));
          const work=(p.operational?.workItems||[]).find(w=>Number(w.id)===13)||null;
          const evidence=(p.operational?.evidence||[]).filter(e=>Number(e.work_item_id)===13);
          const continued=evidence.find(e=>e.source==="Google Merchant Center — Needs attention / Aug 29 email")||null;
          console.log("SES_WORK13_CONTINUED_VALIDATION="+JSON.stringify({work,continued,counts:p.counts||null}));
          if(!work || String(work.status||"").toLowerCase()!=="awaiting_external_validation"){
            throw new Error("Work Item #13 is not awaiting_external_validation.");
          }
          if(!continued){
            throw new Error("Continued external validation evidence did not verify.");
          }
          NODE
