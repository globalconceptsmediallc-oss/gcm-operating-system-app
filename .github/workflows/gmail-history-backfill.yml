# =========================================================
# GCM OS — Process SES iHeart station confirmations
# Authorized operational action: 2026-08-29
# Uses production Media workflow endpoints so confirmation logic stays canonical.
# =========================================================
name: Process SES Radio Confirmations

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Process confirmations through production Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const endpoint=process.env.WORKER_URL;

          async function api(operation, extra={}) {
            const r=await fetch(endpoint,{
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify({action:"get-media-operations",operation,...extra})
            });
            const j=await r.json().catch(()=>({}));
            if(!r.ok || j?.ok!==true) throw new Error(operation+": "+(j?.error||j?.details||r.status));
            return j;
          }

          const items=[
            {
              creativeName:"Safe Moving Services 2",
              packageId:4,
              gmailMessageId:"1a04a45bab9d1341",
              gmailThreadId:"1a044a593149b942",
              receivedAt:"2026-08-28T21:27:56.000Z",
              subject:"Traffic Instructions — Southeast Safes — Safe Moving Services 2",
              bodyText:"Confirmed! 😊",
              history:"Station confirmation completed for Safe Moving Services 2; iHeartMedia confirmed receipt and trafficking for Melbourne / WMMB and Orlando / WFLA. Creative marked Running / Rotation."
            },
            {
              creativeName:"Safe Repair Services 2",
              packageId:3,
              gmailMessageId:"1a04a460ea554d75",
              gmailThreadId:"1a044921f5bde047",
              receivedAt:"2026-08-28T21:28:18.000Z",
              subject:"Traffic Instructions — Southeast Safes — Safe Repair Services 2",
              bodyText:"Confirmed! 😊",
              history:"Station confirmation completed for Safe Repair Services 2; iHeartMedia confirmed receipt and trafficking for Melbourne / WMMB and Orlando / WFLA. Creative marked Running / Rotation."
            }
          ];

          let state=(await api("get_creative_workflow")).creativeWorkflow;

          for (const item of items) {
            const creative=state.creatives.find(c=>c.creativeName===item.creativeName);
            if(!creative) throw new Error("Creative not found: "+item.creativeName);

            const pkg=state.trafficPackages.find(p=>Number(p.id)===item.packageId);
            if(!pkg || Number(pkg.creativeId)!==Number(creative.id)) {
              throw new Error("Traffic package mismatch for "+item.creativeName);
            }

            await api("record_station_confirmation",{
              trafficPackageId:item.packageId,
              confirmation:{
                gmailMessageId:item.gmailMessageId,
                gmailThreadId:item.gmailThreadId,
                fromEmail:"StephanieStein@iheartmedia.com",
                toEmail:"globalconceptsmediallc@gmail.com",
                subject:item.subject,
                receivedAt:item.receivedAt,
                bodyText:item.bodyText,
                stationReceivedConfirmed:true,
                stationTraffickedConfirmed:true,
                approvedBy:"Andy"
              }
            });

            await api("save_creative",{
              creativeId:creative.id,
              creative:{
                clientId:creative.clientId,
                creativeName:creative.creativeName,
                mediaType:creative.mediaType || "Radio",
                lengthSeconds:creative.lengthSeconds || 30,
                isci:creative.isci || "",
                currentStage:"Running / Rotation",
                status:"running",
                ideaDirection:creative.ideaDirection || "",
                workingScript:creative.workingScript || "",
                approvedScript:creative.approvedScript || "",
                finalScript:creative.finalScript || "",
                voiceTalent:creative.voiceTalent || "",
                recordingStatus:creative.recordingStatus || "",
                recordingReceivedDate:creative.recordingReceivedDate || "",
                recordingReviewNotes:creative.recordingReviewNotes || "",
                productionStatus:creative.productionStatus || "",
                finalAudioFileName:creative.finalAudioFileName || "",
                coopScript:creative.coopScript || "",
                owner:creative.owner || "Andy"
              }
            });

            const already=(state.history||[]).some(h=>Number(h.creativeId)===Number(creative.id) && h.content===item.history);
            if(!already){
              await api("append_creative_history",{
                creativeId:creative.id,
                entryType:"decision",
                stage:"Station Confirmation",
                author:"Andy",
                content:item.history
              });
            }

            state=(await api("get_creative_workflow")).creativeWorkflow;
          }

          const verify=(await api("get_creative_workflow")).creativeWorkflow;
          for(const item of items){
            const creative=verify.creatives.find(c=>c.creativeName===item.creativeName);
            const pkg=verify.trafficPackages.find(p=>Number(p.id)===item.packageId);
            const confirmation=verify.confirmations.find(c=>c.gmailMessageId===item.gmailMessageId && Number(c.trafficPackageId)===item.packageId);
            console.log(JSON.stringify({creativeName:item.creativeName,creative,pkg,confirmation}));
            if(!creative || creative.status!=="running" || creative.currentStage!=="Running / Rotation") throw new Error("Creative not running: "+item.creativeName);
            if(!pkg || pkg.packageStatus!=="confirmed" || !pkg.confirmedAt) throw new Error("Package not confirmed: "+item.creativeName);
            if(!confirmation || !confirmation.stationReceivedConfirmed || !confirmation.stationTraffickedConfirmed) throw new Error("Confirmation not verified: "+item.creativeName);
          }
          NODE
