# =========================================================
# GCM OS — Read-only verification of SES GA email record
# No production writes
# =========================================================
name: Verify SES GA Email Record

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install wrangler@4.122.0
      - name: Query production D1 read only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== EMAIL ID MATCHES ==="
          npx wrangler d1 execute DB --remote --command="SELECT name, sql FROM sqlite_master WHERE type='table' AND name IN ('communications','activity_records','evidence','gmail_monitoring_evidence');"
          echo "=== COMMUNICATIONS ==="
          npx wrangler d1 execute DB --remote --command="SELECT * FROM communications WHERE subject LIKE '%Google Analytics performance report%' OR content LIKE '%1a04470a7c8391dc%' OR content LIKE '%July 31st - August 27th%' LIMIT 20;" || true
          echo "=== ACTIVITY ==="
          npx wrangler d1 execute DB --remote --command="SELECT * FROM activity_records WHERE title LIKE '%Google Analytics%' OR description LIKE '%July 31st - August 27th%' OR description LIKE '%840%' LIMIT 20;" || true
          echo "=== EVIDENCE ==="
          npx wrangler d1 execute DB --remote --command="SELECT * FROM evidence WHERE source LIKE '%Google Analytics%' OR description LIKE '%July 31st - August 27th%' OR description LIKE '%840%' LIMIT 20;" || true
          echo "=== GMAIL MONITORING ==="
          npx wrangler d1 execute DB --remote --command="SELECT * FROM gmail_monitoring_evidence WHERE gmail_message_id='1a04470a7c8391dc' OR source_subject LIKE '%Google Analytics performance report%' LIMIT 20;" || true
