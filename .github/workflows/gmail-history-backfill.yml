# =========================================================
# GCM OS — Record HBG Google review monitoring evidence
# Authorized operational action: 2026-08-29
# =========================================================
name: Record HBG Review Monitoring

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install wrangler@4.122.0

      - name: Build D1 update
        run: |
          cat > /tmp/record-hbg-review.sql <<'SQL'
          INSERT INTO evidence (
            client_id,
            investigation_id,
            work_item_id,
            communication_id,
            evidence_type,
            source,
            description,
            url,
            captured_at
          )
          SELECT
            c.id,
            NULL,
            NULL,
            NULL,
            'monitoring',
            'Google Business Profile Review',
            'August 28, 2026: Kyle Sexton left Harry Beckwith Guns & Range a 5-star Google Business Profile rating with no written review text. Positive reputation signal only; no investigation or work item required.',
            NULL,
            '2026-08-28 18:45:55'
          FROM clients c
          WHERE c.client_code = 'HBG'
            AND NOT EXISTS (
              SELECT 1 FROM evidence e
              WHERE e.client_id = c.id
                AND e.source = 'Google Business Profile Review'
                AND instr(COALESCE(e.description,''), 'Kyle Sexton') > 0
            );
          SQL

      - name: Apply update to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file=/tmp/record-hbg-review.sql

      - name: Verify through production Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const r=await fetch(process.env.WORKER_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-client-workspace",clientCode:"HBG"})
          });
          const p=await r.json();
          if(!r.ok||p?.ok!==true) throw new Error(p?.error||String(r.status));
          const hit=(p.operational?.evidence||[]).find(e=>e.source==="Google Business Profile Review" && String(e.description||"").includes("Kyle Sexton"))||null;
          console.log("HBG_REVIEW_MONITORING="+JSON.stringify({hit,counts:p.counts||null}));
          if(!hit) throw new Error("HBG review evidence did not verify.");
          NODE
