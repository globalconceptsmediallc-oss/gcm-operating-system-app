# =========================================================
# GCM OS — Record SES Google Ads manager-link evidence
# Authorized operational action: 2026-08-29
# =========================================================
name: Record SES Google Ads Manager Link

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install wrangler@4.122.0

      - name: Build D1 update
        run: |
          cat > /tmp/record-ses-manager-link.sql <<'SQL'
          INSERT INTO evidence (
            client_id,
            investigation_id,
            work_item_id,
            communication_id,
            evidence_type,
            source,
            description,
            url,
            captured_at
          )
          SELECT
            wi.client_id,
            wi.investigation_id,
            wi.id,
            wi.communication_id,
            'setup_confirmation',
            'Google Ads Manager Link Confirmation',
            'Google Ads email dated August 28, 2026 confirmed that Southeast Safes Google Ads account 821-145-9629 is linked to manager account Shopify Google Channel App 326-559-5623. Google states no action is needed when the link is expected. This matches the approved Shopify Google & YouTube conversion-measurement setup completed for Work Item #11.',
            NULL,
            '2026-08-28 19:08:52'
          FROM work_items wi
          WHERE wi.id = 11
            AND NOT EXISTS (
              SELECT 1 FROM evidence e
              WHERE e.work_item_id = 11
                AND e.evidence_type = 'setup_confirmation'
                AND e.source = 'Google Ads Manager Link Confirmation'
            );
          SQL

      - name: Apply update to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file=/tmp/record-ses-manager-link.sql

      - name: Verify through production Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const r=await fetch(process.env.WORKER_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-client-workspace",clientCode:"SES"})
          });
          const p=await r.json();
          if(!r.ok||p?.ok!==true) throw new Error(p?.error||String(r.status));
          const hit=(p.operational?.evidence||[]).find(e=>e.work_item_id==11 && e.source==="Google Ads Manager Link Confirmation")||null;
          console.log("SES_MANAGER_LINK="+JSON.stringify({hit,counts:p.counts||null}));
          if(!hit) throw new Error("SES manager-link evidence did not verify.");
          NODE
