# =========================================================
# GCM OS — Read-only test of Media commercial grouping
# No production writes
# =========================================================
name: Test Media Commercial Grouping

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check media.html inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("media.html","utf8");
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m=>m[1])
            .filter(s=>s.trim());
          if(!scripts.length) throw new Error("No inline script found.");
          fs.writeFileSync("/tmp/media-inline.js",scripts.join("\n"));
          NODE
          node --check /tmp/media-inline.js

      - name: Verify creative-centric grouping against production Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const r=await fetch(process.env.WORKER_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-media-operations",operation:"get_creative_workflow"})
          });
          const p=await r.json();
          if(!r.ok||p?.ok!==true) throw new Error(p?.error||String(r.status));
          const w=p.creativeWorkflow||{};
          for(const name of ["Safe Moving Services 2","Safe Repair Services 2"]){
            const c=(w.creatives||[]).find(x=>x.creativeName===name);
            if(!c) throw new Error("Missing creative: "+name);
            const a=(w.assignments||[]).filter(x=>Number(x.creativeId)===Number(c.id));
            const markets=a.map(x=>({market:x.market,outlet:x.outletName,end:x.rotationEndDate}));
            console.log(name,markets);
            if(a.length!==2) throw new Error(name+" should have 2 market assignments.");
            if(!a.some(x=>x.market==="Melbourne"&&x.outletName==="WMMB"&&x.rotationEndDate==="2026-09-30")) throw new Error(name+" missing Melbourne Sep 30 end date.");
            if(!a.some(x=>x.market==="Orlando"&&x.outletName==="WFLA"&&x.rotationEndDate==="2026-09-30")) throw new Error(name+" missing Orlando Sep 30 end date.");
          }
          NODE
