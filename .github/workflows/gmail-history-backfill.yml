# =========================================================
# GCM OS — Read-only MoveASafe investigation history check
# No production writes
# =========================================================
name: Verify MoveASafe Investigation History

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install wrangler@4.122.0
      - name: Query production D1 read only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute DB --remote --command="SELECT i.* FROM investigations i JOIN clients c ON c.id=i.client_id WHERE c.client_code='MAS' ORDER BY i.id;"
          npx wrangler d1 execute DB --remote --command="SELECT e.* FROM evidence e JOIN clients c ON c.id=e.client_id WHERE c.client_code='MAS' ORDER BY e.id;"
          npx wrangler d1 execute DB --remote --command="SELECT ar.* FROM activity_records ar JOIN clients c ON c.id=ar.client_id WHERE c.client_code='MAS' ORDER BY ar.id DESC LIMIT 25;"
