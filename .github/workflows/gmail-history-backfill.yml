# =========================================================
# GCM OS — Update SES Work Item #13 after investigation
# Authorized by user 2026-08-28.
# Purpose: preserve the live diagnosis, keep the item open, and move it
# to Awaiting External Validation until Google clears the 4 disapprovals.
# =========================================================
name: Update SES Merchant Center Work 13

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install wrangler@4.122.0

      - name: Build D1 update
        run: |
          cat > /tmp/update-work-13.sql <<'SQL'
          UPDATE work_items
          SET
            title = 'Verify Google clears the 4 Southeast Safes Merchant Center missing-price disapprovals after reprocessing',
            description = 'Original source: Google Merchant Center reported 4 Southeast Safes products with Missing product price. Investigation completed August 28, 2026. Google Search Console live Merchant Listing tests now validate the exact affected product variants and their current prices: Liberty Safe Home SE $2,299; Liberty Safe Jewelry Drawers $89; Liberty Safe Desiccant Moisture Absorbers $32; Liberty Safe Beast Vault Door Series $9,109. Robots access is not blocking variant URLs, current structured data is valid, availability is present, and Merchant Center automatic price updates are enabled. No current Shopify, robots, theme, product-price, or inventory correction is supported by the evidence. Merchant Center is still showing the prior disapproval state, so the remaining action is to wait for Google reprocessing and verify that all four products return to approved status.',
            status = 'awaiting_external_validation',
            actual_impact = '4 of 4 affected exact variant URLs currently pass Google live Merchant Listing validation with valid USD prices. No production website defect requiring correction was found. Merchant Center has not yet cleared the four stale missing-price disapprovals.',
            expected_impact = 'Final proof is Merchant Center showing all four affected products approved with the Missing product price issue cleared.',
            updated_at = '2026-08-28 08:28:00'
          WHERE id = 13
            AND client_id = (SELECT id FROM clients WHERE client_code = 'SES' LIMIT 1);

          INSERT INTO evidence (
            client_id,
            investigation_id,
            work_item_id,
            communication_id,
            evidence_type,
            source,
            description,
            url,
            captured_at
          )
          SELECT
            wi.client_id,
            wi.investigation_id,
            wi.id,
            wi.communication_id,
            'verification',
            'Google Search Console Live Tests / Merchant Center',
            'August 28, 2026 verification: Home SE variant 42126140702817 showed Merchant Listing price USD 2299; Jewelry Drawers variant 32801040138337 showed USD 89; Desiccant Moisture Absorbers variant 32796192964705 showed USD 32; Beast Vault Door Series variant 39290865287265 showed USD 9109. All four live Merchant Listings were valid. Merchant Center automatic Price Updates are enabled, but Merchant Center still showed the four Missing product price disapprovals pending reprocessing.',
            NULL,
            '2026-08-28 08:28:00'
          FROM work_items wi
          WHERE wi.id = 13
            AND NOT EXISTS (
              SELECT 1
              FROM evidence e
              WHERE e.work_item_id = 13
                AND e.evidence_type = 'verification'
                AND e.source = 'Google Search Console Live Tests / Merchant Center'
            );
          SQL

      - name: Apply update to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file=/tmp/update-work-13.sql

      - name: Verify through production Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const response=await fetch(process.env.WORKER_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-client-workspace",clientCode:"SES"})
          });
          const payload=await response.json();
          if(!response.ok||payload?.ok!==true) throw new Error(payload?.error||String(response.status));
          const item=(payload.operational?.workItems||[]).find(w=>Number(w.id)===13)||null;
          const evidence=(payload.operational?.evidence||[]).filter(e=>Number(e.work_item_id)===13);
          console.log("WORK13_VERIFY="+JSON.stringify({item,evidence,counts:payload.counts||null}));
          if(!item || item.status!=="awaiting_external_validation"){
            throw new Error("Work Item #13 did not verify in awaiting_external_validation.");
          }
          NODE
