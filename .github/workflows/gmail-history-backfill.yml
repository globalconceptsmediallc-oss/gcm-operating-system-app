# =========================================================
# GCM OS — Record HB Guns / Pickett hosting migration call
# Authorized operational action: 2026-08-29
# =========================================================
name: Record Website Migration Call

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install wrangler@4.122.0
      - name: Build D1 update
        run: |
          cat > /tmp/record-migration-call.sql <<'SQL'
          INSERT INTO calendar_appointments (
            client_id,
            title,
            appointment_type_id,
            scheduled_at,
            time_zone,
            location,
            contact_email,
            client_label,
            notes,
            status,
            source,
            source_key,
            created_at,
            updated_at
          )
          SELECT
            NULL,
            'HB Guns / Pickett Weaponry Hosting Migration Call',
            3,
            '2026-08-31T10:00:00',
            'America/New_York',
            'Phone',
            'pc@pchouseproductions.com',
            'HB Guns / Pickett Weaponry',
            'Phone call with Mr. PC and Michelle Pickett regarding the next phase of hosting/email/website migration for HBGuns.com and PickettWeaponry.com. Preserve Andy/GCM access and protect Google Analytics, Search Console, DNS, redirects, tracking, and SEO configuration during migration. Email thread: 1a03441d83d2055c.',
            'scheduled',
            'gcm_os_calendar',
            'gmail-thread:1a03441d83d2055c:2026-08-31T10:00',
            CURRENT_TIMESTAMP,
            CURRENT_TIMESTAMP
          WHERE NOT EXISTS (
            SELECT 1
            FROM calendar_appointments
            WHERE source_key = 'gmail-thread:1a03441d83d2055c:2026-08-31T10:00'
              AND deleted_at IS NULL
          );
          SQL
      - name: Apply update to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file=/tmp/record-migration-call.sql
      - name: Verify production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --command="SELECT id,title,scheduled_at,time_zone,location,contact_email,client_label,status,source,source_key FROM calendar_appointments WHERE source_key='gmail-thread:1a03441d83d2055c:2026-08-31T10:00' AND deleted_at IS NULL;"
