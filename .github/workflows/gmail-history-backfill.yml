# =========================================================
# GCM OS — Test Media duplicate-card CSS guard
# No production writes
# =========================================================
name: Test Media Duplicate Card Guard

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify Media guard
        run: |
          grep -q 'media.html · v2.4.6' media.html
          grep -q 'data-gcm-native-creative-queue="1"' media.html
          grep -q 'gcm-creative-card{display:none!important}' media.html
          node <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("media.html","utf8");
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m=>m[1]).filter(s=>s.trim());
          fs.writeFileSync("/tmp/media-inline.js",scripts.join("\n"));
          NODE
          node --check /tmp/media-inline.js
