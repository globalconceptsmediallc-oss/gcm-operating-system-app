# =========================================================
# GCM OS one-time August Gmail history recovery verification
# Authorized production reconciliation: 2026-08-28
# Purpose:
# - Preserve the one missed LUMI monitoring event.
# - Identify the authoritative existing SES Merchant Center source record.
# - Verify post-backfill client workspace counts and Mission Control attention.
# Existing D1 duplicate protection remains authoritative.
# =========================================================
name: Verify August Gmail History Backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify August D1 recovery
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const url = process.env.WORKER_URL;

          async function post(body) {
            const response = await fetch(url, {
              method:"POST",
              headers:{ "Content-Type":"application/json" },
              body:JSON.stringify(body)
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload?.ok !== true) {
              throw new Error(`${body.action} failed HTTP ${response.status}: ${payload?.error || "unknown error"}`);
            }
            return payload;
          }

          // One operational August item omitted by the first batch.
          const lumi = await post({
            action:"route-gmail-disposition",
            gmailMessageId:"1a0092c798cc34ac",
            clientCode:"LUMI",
            disposition:"monitoring"
          });
          console.log("LUMI_RECOVERY=" + JSON.stringify({
            duplicate:Boolean(lumi.duplicate),
            activityRecordId:lumi.activityRecordId || lumi.existing?.activityRecordId || null,
            existing:lumi.existing || null
          }));

          // Duplicate-safe probe: reveals exactly what D1 already has for the SES source.
          const sesMerchant = await post({
            action:"route-gmail-disposition",
            gmailMessageId:"1a025bfcd8bf599b",
            clientCode:"SES",
            disposition:"investigation"
          });
          console.log("SES_MERCHANT_EXISTING=" + JSON.stringify({
            duplicate:Boolean(sesMerchant.duplicate),
            existing:sesMerchant.existing || null,
            communicationId:sesMerchant.communicationId || null,
            investigationId:sesMerchant.investigationId || null,
            activityRecordId:sesMerchant.activityRecordId || null
          }));

          const clients = ["SES","A1","HBG","NFS","SFS","PW","MAS","GCM","4A","LUMI"];
          for (const clientCode of clients) {
            const workspace = await post({
              action:"get-client-workspace",
              clientCode
            });
            const counts = workspace?.workspace?.metadata?.operationalCounts
              || workspace?.clientWorkspace?.metadata?.operationalCounts
              || workspace?.metadata?.operationalCounts
              || null;
            const operational =
              workspace?.workspace?.operational
              || workspace?.clientWorkspace?.operational
              || workspace?.operational
              || null;
            console.log("CLIENT_VERIFY=" + JSON.stringify({
              clientCode,
              counts,
              monitoringInvestigationCount:
                operational?.monitoringInvestigations?.length ?? null,
              activeInvestigationCount:
                operational?.investigations?.length ?? null,
              investigationHistoryCount:
                operational?.investigationHistory?.length ?? null
            }));
          }

          const mission = await post({ action:"get-mission-control" });
          const mc = mission?.missionControl || mission;
          console.log("MISSION_ATTENTION=" + JSON.stringify({
            clientsRequiringAttention:mc?.clientsRequiringAttention || [],
            navAttention:mc?.navAttention || null
          }));
          NODE
