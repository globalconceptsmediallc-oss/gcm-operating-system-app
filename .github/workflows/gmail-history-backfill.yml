# =========================================================
# GCM OS — Verify SES Work Item #11 follow-up state
# Read-only production verification: 2026-08-28
# =========================================================
name: Verify SES Work 11 Follow-up

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read SES communication history
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const r=await fetch(process.env.WORKER_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-client-workspace",clientCode:"SES"})
          });
          const p=await r.json();
          if(!r.ok||p?.ok!==true) throw new Error(p?.error||String(r.status));
          const comms=(p.operational?.communications||[]).filter(c=>
            String(c.external_id||"").includes("1a035c17b2cc8ec9") ||
            /90-Day Q3\/Q4 Growth Campaign/i.test(String(c.subject||""))
          );
          const work=(p.operational?.workItems||[]).find(w=>Number(w.id)===11)||null;
          console.log("SES_WORK11_STATE="+JSON.stringify({comms,work,counts:p.counts||null}));
          NODE
