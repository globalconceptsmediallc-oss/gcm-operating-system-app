# =========================================================
# GCM OS — Record A1 Semrush top-10 monitoring evidence
# Authorized operational action: 2026-08-29
# =========================================================
name: Record A1 Position Monitoring

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install wrangler@4.122.0
      - name: Build D1 update
        run: |
          cat > /tmp/record-a1-position-monitoring.sql <<'SQL'
          INSERT INTO activity_records (
            client_id,
            activity_date,
            category,
            activity,
            evidence_type,
            evidence_reference,
            status,
            owner,
            expected_impact,
            actual_impact,
            notes,
            source_type,
            source_reference
          )
          SELECT
            c.id,
            '2026-08-29',
            'SEO Monitoring',
            'SEMrush Position Tracking alert — melbourne fl locksmith entered top 10',
            'SEMrush Position Tracking',
            'gmail-thread:1a04a5d6fa7172b8',
            'completed',
            'GCM',
            'Preserve positive ranking movement for trend analysis.',
            'Keyword "melbourne fl locksmith" reached position 7 on Aug 29, 2026 and triggered the Enters the top 10 rule. Semrush reported Diff 93 and search volume 0.',
            'Positive monitoring signal only. No investigation or work item created.',
            'gmail_monitoring',
            'gmail-thread:1a04a5d6fa7172b8'
          FROM clients c
          WHERE c.client_code = 'A1'
            AND NOT EXISTS (
              SELECT 1 FROM activity_records ar
              WHERE ar.source_reference = 'gmail-thread:1a04a5d6fa7172b8'
            );

          INSERT INTO gmail_monitoring_evidence (
            client_id,
            activity_record_id,
            source_type,
            source_reference,
            gmail_message_id,
            gmail_thread_id,
            source_subject,
            source_sender,
            source_date,
            source_content,
            structured_evidence_json,
            evidence_summary,
            status,
            created_at,
            updated_at
          )
          SELECT
            c.id,
            ar.id,
            'gmail',
            'gmail-thread:1a04a5d6fa7172b8',
            '1a04a5d6fa7172b8',
            '1a04a5d6fa7172b8',
            'Notification of rank change. Project: A1 Action',
            'Semrush Position Tracking <position-tracking-alerts@semrush.com>',
            'August 29, 2026',
            'Project: A1 Action / a1actionsafeandlock.com. Device & Location: Melbourne, Florida, United States (Google), English. Rule: Enters the top 10. Keyword: melbourne fl locksmith. Position on Aug 29: 7. Diff: 93. Volume: 0.',
            '{"type":"monitoring_evidence","project":"A1 Action","domain":"a1actionsafeandlock.com","device_location":"Melbourne, Florida, United States (Google)","rule":"Enters the top 10","keyword":"melbourne fl locksmith","position":7,"diff":93,"volume":0,"disposition":"positive_monitoring_only"}',
            'SEMrush alert: melbourne fl locksmith entered the top 10 at position 7; positive SEO monitoring signal; volume 0; no new work required.',
            'monitoring_saved',
            CURRENT_TIMESTAMP,
            CURRENT_TIMESTAMP
          FROM clients c
          JOIN activity_records ar
            ON ar.client_id = c.id
           AND ar.source_reference = 'gmail-thread:1a04a5d6fa7172b8'
          WHERE c.client_code = 'A1'
            AND NOT EXISTS (
              SELECT 1 FROM gmail_monitoring_evidence g
              WHERE g.source_reference = 'gmail-thread:1a04a5d6fa7172b8'
            );
          SQL
      - name: Apply update to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file=/tmp/record-a1-position-monitoring.sql
      - name: Verify production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --command="SELECT id, client_id, activity_record_id, source_subject, evidence_summary, status FROM gmail_monitoring_evidence WHERE source_reference='gmail-thread:1a04a5d6fa7172b8';"
