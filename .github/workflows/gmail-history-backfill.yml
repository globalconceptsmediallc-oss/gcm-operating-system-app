# =========================================================
# GCM OS — Record SES Work Item #11 Google Ads publish milestone
# Authorized operational action: 2026-08-29
# =========================================================
name: Record SES Work 11 Google Ads Publish

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install wrangler@4.122.0

      - name: Build D1 progress update
        run: |
          cat > /tmp/record-ses-google-ads-publish.sql <<'SQL'
          UPDATE work_items
          SET
            description = description ||
              '\n\nGOOGLE ADS PUBLISH MILESTONE — 2026-08-29 09:33 ET: Operator confirmed the SES Lake Nona/Narcoossee Search campaign was published after Google Ads Review showed it ready to publish. Campaign remains part of active Work Item #11 and is not marked complete because the broader 90-day plan also includes CTV and Meta, and because Google Ads billing must still be corrected. Serving is not expected before the September 1 start date; additionally, the account currently has a billing/payment hold until the attached card/billing issue is fixed.',
            updated_at = '2026-08-29 09:33:00'
          WHERE id = 11
            AND client_id = (SELECT id FROM clients WHERE client_code = 'SES' LIMIT 1)
            AND status = 'in_progress'
            AND instr(COALESCE(description,''), 'GOOGLE ADS PUBLISH MILESTONE — 2026-08-29 09:33 ET') = 0;

          INSERT INTO evidence (
            client_id,
            investigation_id,
            work_item_id,
            communication_id,
            evidence_type,
            source,
            description,
            url,
            captured_at
          )
          SELECT
            wi.client_id,
            wi.investigation_id,
            wi.id,
            wi.communication_id,
            'work_progress',
            'Google Ads Publish Confirmation',
            'Operator confirmed publication of campaign SES | Search | Lake Nona-Narcoossee | 90-Day on August 29, 2026 after Google Ads Review showed it ready to publish. Campaign dates remain September 1-November 30, 2026 with $1,800 campaign-total budget. The account currently has a billing/payment hold because the attached card/billing must be fixed, so serving is blocked until billing is resolved; the September 1 start date separately prevents early serving. Work Item #11 remains in progress pending billing correction, post-publish status verification, and the remaining approved CTV/Meta setup.',
            NULL,
            '2026-08-29 09:33:00'
          FROM work_items wi
          WHERE wi.id = 11
            AND NOT EXISTS (
              SELECT 1 FROM evidence e
              WHERE e.work_item_id = 11
                AND e.evidence_type = 'work_progress'
                AND e.source = 'Google Ads Publish Confirmation'
            );
          SQL

      - name: Apply update to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file=/tmp/record-ses-google-ads-publish.sql

      - name: Verify through production Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const r=await fetch(process.env.WORKER_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-client-workspace",clientCode:"SES"})
          });
          const p=await r.json();
          if(!r.ok||p?.ok!==true) throw new Error(p?.error||String(r.status));
          const work=(p.operational?.workItems||[]).find(w=>Number(w.id)===11)||null;
          const evidence=(p.operational?.evidence||[]).filter(e=>Number(e.work_item_id)===11);
          const publish=evidence.find(e=>e.source==="Google Ads Publish Confirmation")||null;
          console.log("SES_WORK11_GOOGLE_ADS_PUBLISH="+JSON.stringify({work,publish,counts:p.counts||null}));
          if(!work || String(work.status||"").toLowerCase()!=="in_progress"){
            throw new Error("Work Item #11 is not in_progress.");
          }
          if(!publish){
            throw new Error("Google Ads publish evidence did not verify.");
          }
          NODE
