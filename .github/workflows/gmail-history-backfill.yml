# =========================================================
# GCM OS — Test Media native commercial queue de-duplication
# No production writes
# =========================================================
name: Test Media Queue De-Duplication

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify inline and shared JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("media.html","utf8");
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          fs.writeFileSync("/tmp/media-inline.js",scripts.join("\n"));
          if(!html.includes('data-gcm-native-creative-queue="1"')) throw new Error("Native creative queue marker missing.");
          const dash=fs.readFileSync("shared/media-dashboard-creatives.js","utf8");
          if(!dash.includes('data-gcm-native-creative-queue')) throw new Error("Dashboard enhancement does not honor native queue.");
          const shell=fs.readFileSync("shared/gcm-shell.js","utf8");
          if(!shell.includes("media-dashboard-creatives.js?v=1.1.2")) throw new Error("Shell cache version not updated.");
          NODE
          node --check /tmp/media-inline.js
          node --check shared/media-dashboard-creatives.js
          node --check shared/gcm-shell.js
