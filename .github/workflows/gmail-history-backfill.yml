# =========================================================
# GCM OS — Test Media shell cache-bust
# No production writes
# =========================================================
name: Test Media Shell Cache Bust

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify cache-bust references
        run: |
          grep -q 'media.html · v2.4.5' media.html
          grep -q 'shared/gcm-shell.js?v=2.0.34' media.html
          grep -q 'media-dashboard-creatives.js?v=1.1.2' shared/gcm-shell.js
          grep -q 'data-gcm-native-creative-queue' shared/media-dashboard-creatives.js
          node --check shared/gcm-shell.js
          node --check shared/media-dashboard-creatives.js
