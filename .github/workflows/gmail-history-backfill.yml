# =========================================================
# GCM OS — Read-only check of MoveASafe current work
# No production writes
# =========================================================
name: Verify MoveASafe Current Work

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gmail-history-backfill.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query production Worker
        env:
          WORKER_URL: https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/
        run: |
          node <<'NODE'
          const r=await fetch(process.env.WORKER_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-client-workspace",clientCode:"MAS"})
          });
          const p=await r.json();
          if(!r.ok||p?.ok!==true) throw new Error(p?.error||String(r.status));
          console.log("MAS_WORKSPACE="+JSON.stringify({
            investigations:p.operational?.investigations||[],
            workItems:p.operational?.workItems||[],
            counts:p.counts||null
          }));
          NODE
