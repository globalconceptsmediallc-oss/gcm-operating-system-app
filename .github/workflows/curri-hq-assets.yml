name: Curri HQ concept assets

on:
  push:
    paths:
      - '.github/workflows/curri-hq-assets.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build genuine high quality WebP asset
        run: |
          set -e
          cat temp/curri-hq/part-00.b64 temp/curri-hq/part-01.b64 temp/curri-hq/part-02.b64 | base64 -d > prospect-previews/john-curri/assets/curri-concept-hq.webp
          test $(stat -c%s prospect-previews/john-curri/assets/curri-concept-hq.webp) -gt 150000
          python3 - <<'PY'
          from pathlib import Path
          p = Path('prospect-previews/john-curri/assets/curri-concept-hq.webp')
          b = p.read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', 'not a valid WebP'
          print('verified WebP', len(b), 'bytes')
          PY

      - name: Point all Curri concept previews to HQ source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('prospect-previews/john-curri/index.html')
          text = path.read_text()
          text = text.replace('Version: 1.1.8', 'Version: 1.1.9', 1)
          text = text.replace('Change Notes — 1.1.8:', 'Change Notes — 1.1.9:\n   - Replaces the heavily compressed concept previews with the original high-resolution Curri library artwork.\n   - Uses one genuine local WebP asset at 1000 × 1000 for sharp rendering.\n   - Uses a cropped treatment for the digital extension while preserving the full image for the direct-mail and landing-page concepts.\n\n   Change Notes — 1.1.8:', 1)
          text = text.replace('assets/postcard-concept.webp?v=117', 'assets/curri-concept-hq.webp?v=119')
          text = text.replace('assets/social-concept.webp?v=117', 'assets/curri-concept-hq.webp?v=119')
          text = text.replace('assets/postcard-concept.webp?v=118', 'assets/curri-concept-hq.webp?v=119')
          text = text.replace('<img src="assets/curri-concept-hq.webp?v=119" alt="Watermarked Global Concepts Media social campaign concept for Realty World Curri Properties">', '<img class="social-preview" src="assets/curri-concept-hq.webp?v=119" alt="Global Concepts Media digital campaign concept for Realty World Curri Properties">')
          marker = '.evidence p,.asset p{margin:0;color:var(--muted);font-size:.88rem}'
          addition = marker + '.asset img.social-preview{aspect-ratio:16/10;object-fit:cover;object-position:center 18%}'
          if '.asset img.social-preview' not in text:
              text = text.replace(marker, addition)
          text = text.replace('Concept preview only · Version 1.1.8', 'Concept preview only · Version 1.1.9')
          text = text.replace('const FILE_VERSION="1.1.8"', 'const FILE_VERSION="1.1.9"')
          text = text.replace('const FILE_VERSION = "1.1.8"', 'const FILE_VERSION = "1.1.9"')
          path.write_text(text)
          PY

      - name: Remove obsolete compressed assets and staging files
        run: |
          rm -f prospect-previews/john-curri/assets/postcard-concept.webp
          rm -f prospect-previews/john-curri/assets/social-concept.webp
          rm -rf temp/curri-hq
          rm -f .github/workflows/curri-hq-assets.yml

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace blurry Curri previews with high quality library artwork"
          git push
