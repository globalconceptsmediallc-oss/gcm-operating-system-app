name: One-Time A1 Client Health Check

on:
  push:
    paths:
      - ".github/workflows/one-time-a1-health-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live A1 Client Health v2
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";
          const response = await fetch(url, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"get-client-workspace", clientCode:"A1" })
          });
          const data = await response.json();
          if (!response.ok || data?.ok !== true) {
            throw new Error(data?.error || `HTTP ${response.status}`);
          }
          const h = data?.record?.clientHealthV2 || null;
          console.log("A1_HEALTH", JSON.stringify({
            score:h?.score,
            status:h?.status,
            trend:h?.trend,
            confidence:h?.confidence,
            confidenceScore:h?.confidenceScore,
            evidenceCoverage:h?.evidenceCoverage,
            dimensions:(h?.dimensions||[]).map(d=>({
              key:d.key,label:d.label,weight:d.weight,score:d.score,status:d.status,trend:d.trend,confidence:d.confidence,evidenceCount:d.evidenceCount,recentEvidenceCount:d.recentEvidenceCount,summary:d.summary
            })),
            whatIsWorking:h?.whatIsWorking,
            needsAttention:h?.needsAttention,
            highestValueMove:h?.highestValueMove,
            whatWeAreWatching:h?.whatWeAreWatching
          }));
          NODE
