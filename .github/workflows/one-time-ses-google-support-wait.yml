name: One-Time SES Google Support Wait

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-ses-google-support-wait.yml"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Record support submission and waiting state in production D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute gcm-operating-system --remote --command "
            UPDATE work_items
            SET status='waiting_external',
                updated_at=datetime('now','-4 hours')
            WHERE id=20 AND client_id=1;

            INSERT INTO evidence (
              client_id, investigation_id, work_item_id, communication_id,
              evidence_type, source, description, url, captured_at
            )
            SELECT
              1, NULL, 20, 107,
              'support_submission',
              'Google Merchant Center Support',
              'Support request submitted September 1, 2026 for Merchant Center 5325664516. Request asks Google to preserve the existing SES account and correct the sub-account/account-structure blocker so the Shopify Google & YouTube app can connect to the existing account. Current state: waiting on Google response; no account deletion, replacement, or product-level workaround authorized.',
              NULL,
              datetime('now','-4 hours')
            WHERE NOT EXISTS (
              SELECT 1 FROM evidence
              WHERE work_item_id=20
                AND evidence_type='support_submission'
                AND source='Google Merchant Center Support'
            );

            SELECT wi.id,wi.status,wi.title,
                   (SELECT COUNT(*) FROM evidence e WHERE e.work_item_id=wi.id AND e.evidence_type='support_submission') AS support_evidence
            FROM work_items wi
            WHERE wi.id=20;
          "
