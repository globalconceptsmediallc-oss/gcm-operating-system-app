name: One-Time Verify GCM Work 17 Cleared

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-verify-gcm-work17-cleared.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify GCM workspace and Mission Control
        shell: bash
        run: |
          node <<'NODE'
          const url="https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";
          const [workspaceRes, missionRes]=await Promise.all([
            fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"get-client-workspace",clientCode:"GCM"})}),
            fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"get-mission-control"})})
          ]);
          const workspace=await workspaceRes.json();
          const mission=await missionRes.json();
          console.log("VERIFY_GCM_CLEAR",JSON.stringify({
            workspaceOk:workspace?.ok,
            openWorkItems:workspace?.counts?.openWorkItems,
            nextActionType:workspace?.record?.workspace?.nextActionType,
            nextActionRecordId:workspace?.record?.workspace?.nextActionRecordId,
            nextAction:workspace?.record?.workspace?.nextAction,
            missionOk:mission?.ok,
            attention:(mission?.missionControl?.clientsRequiringAttention||[]).map(x=>({clientCode:x.clientCode,clientName:x.clientName})),
            highest:mission?.missionControl?.highestPriorityDecision||null
          }));
          if(!workspaceRes.ok||workspace?.ok!==true||!missionRes.ok||mission?.ok!==true) throw new Error("Verification read failed");
          NODE
