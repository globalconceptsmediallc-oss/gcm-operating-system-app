# GCM OS | Website Intelligence Regression Gate
# File: .github/workflows/website-intelligence-test.yml
# Version: 1.0.2
# v1.0.2: Require monitored Investigation UI and external validation workflow regression.
# v1.0.1: Verify Google Search Console Redirect-error issue scope and locked-evidence regression.
name: Website Intelligence Engine Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  website-intelligence-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Display Node Version
        run: node --version

      - name: Install Dependencies
        run: npm install

      - name: Run Website Intelligence Tests
        run: npm run test:website-intelligence

      - name: Run GSC Redirect Investigation Regression
        run: node tests/workGscRedirectDecision.test.js

      - name: Run Monitored Investigation Regression
        run: node tests/workInvestigationExternalValidation.test.js

      - name: Run Calendar Source Sync Lock
        run: node tests/calendarSourceSync.test.js

      - name: Run Forward Look Outcome Correction Regression
        run: npm run test:forward-look-interaction

      - name: Run Promotion Launch Evidence Regression
        run: npm run test:promotion-launch-evidence

      - name: Run Social Publishing Library Regression
        run: npm run test:social-publishing-library

      - name: Run Authenticated Publishing Operator Regression
        run: npm run test:social-publishing-operator
