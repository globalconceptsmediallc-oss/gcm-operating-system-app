name: Fix Curri concept assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-curri-assets.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore and re-encode Curri concept assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/curri-assets
          git show 6c428c46cdc5f42f1f96059a33bf7f84943478a8:prospect-previews/john-curri/assets/postcard-concept.jpg > /tmp/curri-assets/postcard-concept.jpg
          git show 6c428c46cdc5f42f1f96059a33bf7f84943478a8:prospect-previews/john-curri/assets/social-concept.jpg > /tmp/curri-assets/social-concept.jpg

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          jobs = [
              (Path('/tmp/curri-assets/postcard-concept.jpg'), Path('prospect-previews/john-curri/assets/postcard-concept.jpg')),
              (Path('/tmp/curri-assets/social-concept.jpg'), Path('prospect-previews/john-curri/assets/social-concept.jpg')),
          ]

          for source, target in jobs:
              with Image.open(source) as im:
                  im.load()
                  im = im.convert('RGB')
                  im.save(
                      target,
                      format='JPEG',
                      quality=90,
                      optimize=True,
                      progressive=False,
                      subsampling=0,
                  )
                  print(f'{target}: {im.size[0]}x{im.size[1]} repaired baseline JPEG')

          index = Path('prospect-previews/john-curri/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('Version: 1.1.2', 'Version: 1.1.3', 1)
          text = text.replace(
              '   Change Notes — 1.1.2:\n',
              '   Change Notes — 1.1.3:\n'
              '   - Rebuilds both Section 02 concept assets as standard baseline JPEGs for Safari/GitHub Pages compatibility.\n'
              '   - Restores the Digital extension image and repairs the Direct-mail concept render.\n'
              '   Change Notes — 1.1.2:\n',
              1,
          )
          text = text.replace('const FILE_VERSION = "1.1.2";', 'const FILE_VERSION = "1.1.3";', 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit repaired assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospect-previews/john-curri/index.html \
                  prospect-previews/john-curri/assets/postcard-concept.jpg \
                  prospect-previews/john-curri/assets/social-concept.jpg
          git commit -m "Fix Curri Section 02 image rendering"
          git push origin HEAD:main
