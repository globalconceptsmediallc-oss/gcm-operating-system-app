name: Fix Curri concept assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-curri-assets.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Repair Curri direct-mail concept asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/curri-assets
          git show 6c428c46cdc5f42f1f96059a33bf7f84943478a8:prospect-previews/john-curri/assets/postcard-concept.jpg > /tmp/curri-assets/postcard-concept.jpg

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          source = Path('/tmp/curri-assets/postcard-concept.jpg')
          target = Path('prospect-previews/john-curri/assets/postcard-concept.jpg')

          with Image.open(source) as im:
              im.load()
              im = im.convert('RGB')
              im.save(target, format='JPEG', quality=90, optimize=True, progressive=False, subsampling=0)
              print(f'{target}: {im.size[0]}x{im.size[1]} repaired baseline JPEG')

          index = Path('prospect-previews/john-curri/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('Version: 1.1.2', 'Version: 1.1.3', 1)
          text = text.replace(
              '   Change Notes — 1.1.2:\n',
              '   Change Notes — 1.1.3:\n'
              '   - Repairs the Direct-mail concept as a standard baseline JPEG for Safari/GitHub Pages compatibility.\n'
              '   - Restores the Digital extension with a clean standalone JPEG asset.\n'
              '   Change Notes — 1.1.2:\n',
              1,
          )
          text = text.replace('const FILE_VERSION = "1.1.2";', 'const FILE_VERSION = "1.1.3";', 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit repaired asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospect-previews/john-curri/index.html prospect-previews/john-curri/assets/postcard-concept.jpg
          git commit -m "Fix Curri Section 02 image rendering"
          git push origin HEAD:main
