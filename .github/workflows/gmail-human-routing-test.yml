# =========================================================
# Global Concepts Media Operating System
# File: .github/workflows/gmail-human-routing-test.yml
# Version: 1.0.0
# Status: Temporary Branch Validation
# Purpose: Run the full production regression suite on the Gmail human-routing
#          branch without deploying the Cloudflare Worker.
# =========================================================
name: Gmail Human Routing Test

on:
  push:
    branches:
      - gmail-human-routing-20260825

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install
      - name: Run Production Tests
        run: npm test
