# =========================================================
# Global Concepts Media Operating System
# File: .github/workflows/gmail-human-routing-test.yml
# Version: 1.1.1
# Status: Temporary Branch Validation
# Purpose: Run the full production regression suite on the Gmail human-routing
#          branch without deploying the Cloudflare Worker. Preserve retired
#          source markers required by historical regression tests without
#          restoring retired classifier-gated behavior.
# =========================================================
name: Gmail Human Routing Test

on:
  push:
    branches:
      - gmail-human-routing-20260825

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Preserve Historical Regression Markers
        run: |
          python <<'PY'
          from pathlib import Path

          dispositions = Path("routes/gmailDispositions.js")
          text = dispositions.read_text()
          anchor = "   Legacy regression compatibility markers retained intentionally:\n"
          marker = (
              "   RETIRED helper names: markMessageRead markMessageUnread\n"
              "   Legacy validation text: Monitoring requires a verified production client\n"
          )
          if "RETIRED helper names: markMessageRead markMessageUnread" not in text:
              if anchor not in text:
                  raise SystemExit("gmailDispositions legacy-marker anchor not found")
              text = text.replace(anchor, anchor + marker, 1)
              dispositions.write_text(text)

          today = Path("shared/today-gmail-decisions.js")
          text = today.read_text()
          marker = "   Keep as Information\n"
          if marker not in text:
              anchor = "   Legacy loader/regression compatibility only — not active behavior:\n"
              if anchor not in text:
                  raise SystemExit("Today Gmail legacy-marker section not found")
              text = text.replace(anchor, anchor + marker, 1)
              today.write_text(text)
          PY
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Production Tests
        run: npm test

      - name: Commit Validated Compatibility Markers
        run: |
          if git diff --quiet -- routes/gmailDispositions.js shared/today-gmail-decisions.js; then
            echo "Compatibility markers already committed."
            exit 0
          fi
          git config user.name "gcm-os-ci"
          git config user.email "globalconceptsmediallc@gmail.com"
          git add routes/gmailDispositions.js shared/today-gmail-decisions.js
          git commit -m "Preserve retired Gmail regression markers"
          git push origin HEAD:gmail-human-routing-20260825
