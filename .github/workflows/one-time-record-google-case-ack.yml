name: One-Time Record Google Case Acknowledgement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-record-google-case-ack.yml"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Record Google support case acknowledgement
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute gcm-operating-system --remote --command "
            UPDATE work_items
            SET status='waiting_external',
                updated_at=datetime('now','-4 hours')
            WHERE id=20 AND client_id=1;

            INSERT INTO evidence (
              client_id, investigation_id, work_item_id, communication_id,
              evidence_type, source, description, url, captured_at
            )
            SELECT
              1, NULL, 20, 107,
              'support_case_acknowledgement',
              'Google Merchant Center Support',
              'Google confirmed support case 2-6555000041304 was opened for the existing Southeast Safes Merchant Center account-structure issue. Google stated the team will work the request and follow up when there is an update. Current state remains waiting on Google; no new decision or work item is required.',
              NULL,
              datetime('now','-4 hours')
            WHERE NOT EXISTS (
              SELECT 1
              FROM evidence
              WHERE work_item_id=20
                AND evidence_type='support_case_acknowledgement'
                AND description LIKE '%2-6555000041304%'
            );

            SELECT wi.id,wi.status,wi.title,
                   (SELECT COUNT(*) FROM evidence e
                    WHERE e.work_item_id=wi.id
                      AND e.evidence_type='support_case_acknowledgement'
                      AND e.description LIKE '%2-6555000041304%') AS acknowledgement_count
            FROM work_items wi
            WHERE wi.id=20;
          "
