name: One-Time Route Latest Semrush SFS

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-route-latest-semrush-sfs.yml"

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Route Semrush SFS email to Monitoring
        shell: bash
        run: |
          node <<'NODE'
          const url = "https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";
          const body = {
            action: "route-gmail-disposition",
            disposition: "monitoring",
            gmailMessageId: "1a05cb62ef83737e",
            gmailThreadId: "1a05cb62ef83737e",
            clientCode: "SFS",
            clientName: "South Florida Safes"
          };
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const data = await response.json();
          console.log("ROUTE_RESULT", JSON.stringify(data));
          if (!response.ok || data?.ok !== true) {
            throw new Error(data?.error || `HTTP ${response.status}`);
          }
          if (data?.disposition !== "monitoring") {
            throw new Error("Expected monitoring disposition.");
          }
          if (!data?.gmailThreadArchived) {
            throw new Error("Expected Gmail thread to be archived.");
          }
          NODE
