name: One-Time Read GCM Work 17

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-read-gcm-work17.yml"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Read Work 17 evidence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute gcm-operating-system --remote --command "
            SELECT id,client_id,communication_id,investigation_id,title,status,priority,owner,expected_impact,actual_impact,created_at,updated_at,completed_at
            FROM work_items WHERE id=17;
            SELECT id,work_item_id,activity_date,category,activity,status,actual_impact,notes,source_type,source_reference,created_at
            FROM activity_records WHERE work_item_id=17 OR notes LIKE '%redirect%' OR activity LIKE '%REDIRECT%' ORDER BY id DESC LIMIT 20;
            SELECT id,work_item_id,evidence_type,source,description,captured_at
            FROM evidence WHERE work_item_id=17 ORDER BY id;
          "
