# =========================================================
# MediaForge
# File: .github/workflows/mediaforge-deploy.yml
# Version: 1.1.1
# Status: Production Validation
# Purpose: Test the source-controlled MediaForge app that is served from
#          the GCM OS GitHub Pages deployment.
# =========================================================

name: MediaForge Validate

on:
  push:
    branches:
      - main
    paths:
      - "mediaforge/**"
      - "tests/mediaforgeNamingRecipe.test.js"
      - "tests/mediaforgeHome.test.js"
      - "package.json"
      - "shared/gcm-shell.js"
      - "tests/sharedAssetVersionLock.test.js"
      - ".github/workflows/mediaforge-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediaforge-production
  cancel-in-progress: true

jobs:
  test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Production Tests
        run: npm test

      - name: Verify MediaForge 3.0 source contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = await import("node:fs");
          const html = fs.readFileSync("mediaforge/index.html", "utf8");
          const home = fs.readFileSync("mediaforge/home.js", "utf8");
          const shell = fs.readFileSync("shared/gcm-shell.js", "utf8");

          for (const marker of [
            "Version 3.0.1 · Task-First Workflow",
            "What do you want to do today?",
            "Rename Product Images",
            "Prepare Images for the Website",
            "Identify Unknown Images",
            "I'm Not Sure — Analyze My Files",
            "Catalog &amp; Settings",
            'src="./home.js?v=1.0.1"'
          ]) {
            if (!html.includes(marker)) {
              throw new Error(`MediaForge source missing: ${marker}`);
            }
          }

          if (!home.includes("extractZipImages")) {
            throw new Error("MediaForge ZIP intake is missing.");
          }

          if (!shell.includes('mediaforge: { label: "MediaForge", href: "mediaforge/"')) {
            throw new Error("GCM shell is not pointing at the integrated MediaForge path.");
          }

          console.log("PASS MediaForge 3.0.1 task-first source contract and integrated GCM OS navigation");
          NODE
