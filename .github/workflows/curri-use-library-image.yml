name: Curri use library concept image

on:
  push:
    paths:
      - '.github/workflows/curri-use-library-image.yml'

permissions:
  contents: write

jobs:
  update-curri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install original Curri concept image in landing-page preview
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('prospect-previews/john-curri/index.html')
          text = path.read_text()

          text = text.replace('Version: 1.1.7', 'Version: 1.1.8', 1)
          text = text.replace(
              'Change Notes — 1.1.7:',
              'Change Notes — 1.1.8:\n   - Restores the original Curri luxury waterfront concept image from the approved concept artwork.\n   - Uses the existing local WebP asset instead of the generic external placeholder image.\n   - Removes duplicate overlay copy so the original concept artwork remains readable.\n   - Preserves the lead form and engagement tracking.\n\n   Change Notes — 1.1.7:',
              1,
          )

          text = text.replace(
              'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1800&q=88',
              'assets/postcard-concept.webp?v=118',
          )

          text = text.replace(
              '.mock-visual>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}',
              '.mock-visual>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#071426}',
          )

          text = text.replace(
              '.mock-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,16,30,.82) 0%,rgba(5,16,30,.58) 48%,rgba(5,16,30,.16) 100%),linear-gradient(0deg,rgba(5,16,30,.40),transparent 50%);z-index:1}',
              '.mock-visual:after{content:none}',
          )

          text = text.replace(
              '.mock-copy{position:relative;z-index:2;min-height:500px;max-width:650px;padding:44px 42px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}',
              '.mock-copy{display:none}',
          )

          text = text.replace('const FILE_VERSION = "1.1.7";', 'const FILE_VERSION = "1.1.8";')
          text = text.replace('Concept preview only · Version 1.1.7', 'Concept preview only · Version 1.1.8')

          path.write_text(text)
          PY

      - name: Commit Curri landing-page correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospect-previews/john-curri/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use original Curri concept image in landing page"
          git push
