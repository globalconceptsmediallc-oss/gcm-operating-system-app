name: One-Time Mission Control Review 2 3 4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-mission-control-review-234.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live Mission Control decisions
        shell: bash
        run: |
          node <<'NODE'
          const url="https://gcm-business-intelligence-worker.globalconceptsmediallc.workers.dev/";
          const response=await fetch(url,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({action:"get-mission-control"})
          });
          const data=await response.json();
          console.log("MISSION_REVIEW",JSON.stringify({
            ok:data?.ok,
            highestPriorityDecision:data?.missionControl?.highestPriorityDecision || data?.highestPriorityDecision || null,
            clientsRequiringAttention:data?.missionControl?.clientsRequiringAttention || data?.clientsRequiringAttention || []
          }));
          if(!response.ok||data?.ok!==true) throw new Error(data?.error||`HTTP ${response.status}`);
          NODE
