# =========================================================
# GCM OS | Temporary, read-only archive transfer
# File: .github/workflows/one-time-mediaforge-drive-archive.yml
# Version: 1.0.0
# Purpose: Export six existing MediaForge deliverables as an artifact so they
# can be verified and stored in the user's Google Drive archive.
# Never modifies, deletes, or overwrites a repository file.
# Remove this temporary workflow after offsite backup verification.
# =========================================================
name: One-time MediaForge archive transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-mediaforge-drive-archive.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Verify all six source files match known Git blob hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object mediaforge/downloads/kristy-lincoln-40-signature-interiors-manifest.csv)" = "6a4348d4910d88d86f6dbf6d5d1956af5ec85284"
          test "$(git hash-object mediaforge/downloads/kristy-lincoln-40-signature-interiors-renamed.zip)" = "3daa71779d18026aeccc776014c892d0348d36e2"
          test "$(git hash-object mediaforge/downloads/kristy-lincoln-50-signature-interiors-manifest.csv)" = "12c683ab62e9a055e5db12319db408e8cf613329"
          test "$(git hash-object mediaforge/downloads/kristy-lincoln-50-signature-interiors-renamed.zip)" = "9eba45cf26ba58a4722daf8d929e291589285e36"
          test "$(git hash-object mediaforge/downloads/mediaforge-kristy-lincoln25-proflex-proxy-test-manifest.csv)" = "5e4848e504ea30cc91cbef755cbc025730d12a29"
          test "$(git hash-object mediaforge/downloads/mediaforge-kristy-lincoln25-proflex-proxy-test.zip)" = "075dfecadcfb3d7bd2785706622dfbfc4e10988f"
          cd mediaforge/downloads
          printf '%s\n' "GCM OS MediaForge Original Completed Deliverables" "Archive prepared: 2026-10-14" "Source repository: globalconceptsmediallc-oss/gcm-operating-system-app" "Source: mediaforge/downloads/" "All six source Git blob hashes verified prior to packaging." "Lincoln 25 package is a TEST-ONLY proxy, not production photography." "No originals were deleted or modified." > ARCHIVE_README.txt
          sha256sum *.zip *.csv > ARCHIVE_CHECKSUMS_SHA256.txt
          test "$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.csv' \) | wc -l)" -eq 6

      - name: Upload the six verified original deliverables as one archive
        uses: actions/upload-artifact@v4
        with:
          name: gcm-mediaforge-deliverables-2026-10-14
          path: |
            mediaforge/downloads/*.zip
            mediaforge/downloads/*.csv
            mediaforge/downloads/ARCHIVE_README.txt
            mediaforge/downloads/ARCHIVE_CHECKSUMS_SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
