name: One-Time MediaForge Kristy LX40 LX50 Finish v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-mediaforge-kristy-lx-finish-v2.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Correct MediaForge Lincoln Signature convention
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path)
              text=p.read_text()
              found=text.count(old)
              if found == 0:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              if count is not None and found != count:
                  raise SystemExit(f"Expected {count} matches in {path}, found {found}: {old[:100]!r}")
              p.write_text(text.replace(old,new))

          replace("mediaforge/naming.js", "Version: 1.1.0", "Version: 1.1.1", 1)
          replace("mediaforge/naming.js", 'export const NAMING_ENGINE_VERSION = "1.1.0";', 'export const NAMING_ENGINE_VERSION = "1.1.1";', 1)
          replace(
              "mediaforge/naming.js",
              'instructions: "Reusable Lincoln Signature Interior recipe. Size is parsed from the source filename. White Ivory Gloss and Black Gloss source variants are normalized to the established Lincoln naming convention. Textured Bronze is the next unique Lincoln exterior sequence after the established 22-position variant list.",',
              'instructions: "Reusable Lincoln Signature Interior recipe using the accepted Lincoln 25 v2 convention. Size is parsed from the source filename. White Ivory Gloss and Black Gloss source variants are normalized. Textured Bronze is intentionally unresolved because the accepted Lincoln 25 job identified it as a Liberty source naming mistake.",',
              1
          )
          replace("mediaforge/naming.js", '      "Textured Bronze = 23"\n', '', 1)
          replace(
              "mediaforge/naming.js",
              '{ key: "suffix", label: "Suffix", enabled: true, source: "fixed", value: "Interior" }',
              '{ key: "suffix", label: "Suffix", enabled: false, source: "fixed", value: "Interior" }',
              2
          )
          replace(
              "mediaforge/naming.js",
              'record.exteriorColor = cleanText(m[2]);',
              'record.exteriorColor = cleanText(m[2]).replace(/[-\\s]+$/g, "");',
              1
          )
          replace(
              "mediaforge/naming.js",
              'const size = source.match(/(?:^|[-_ ])(08|12|17|25)(?:[-_ ]|$)/i);',
              'const size = source.match(/(?:^|[-_ ])(08|12|17|25|40|50)(?:[-_ ]|$)/i);',
              1
          )

          replace("mediaforge/naming-ui.js", "Version: 1.0.1", "Version: 1.0.2", 1)
          replace("mediaforge/naming-ui.js", './naming.js?v=1.1.0', './naming.js?v=1.1.1', 1)

          replace("mediaforge/index.html", "Version: 2.2.1", "Version: 2.2.2", 1)
          replace("mediaforge/index.html", "Version 2.2.1 · Flexible Naming Recipes", "Version 2.2.2 · Flexible Naming Recipes", 1)
          replace("mediaforge/index.html", './naming-ui.js?v=1.0.1', './naming-ui.js?v=1.0.2', 1)

          p=Path("tests/mediaforgeNamingRecipe.test.js")
          text=p.read_text()
          text=text.replace("Version: 1.1.0", "Version: 1.1.1", 1)
          text=text.replace(
              '"liberty-lincoln-25-9-bronze-gloss-signature-interior-loaded-interior.webp"',
              '"liberty-lincoln-25-9-bronze-gloss-signature-interior-loaded.webp"'
          )
          text=text.replace(
              '"liberty-lincoln-40-6-white-gloss-signature-interior-loaded-interior.webp"',
              '"liberty-lincoln-40-6-white-gloss-signature-interior-loaded.webp"'
          )
          text=text.replace(
              '"liberty-lincoln-40-14-black-gloss-signature-interior-empty-interior.webp"',
              '"liberty-lincoln-40-14-black-gloss-signature-interior-empty.webp"'
          )
          old='''assert.equal(lx50Textured.ready, true);\nassert.equal(\n  lx50Textured.filename,\n  "liberty-lincoln-50-23-textured-bronze-signature-interior-full-no-guns-interior.webp"\n);'''
          new='''assert.equal(lx50Textured.ready, false);\nassert.ok(lx50Textured.missing.includes("Color Order"));'''
          if old not in text:
              raise SystemExit("Expected LX50 Textured Bronze test block not found")
          text=text.replace(old,new,1)
          text=text.replace(
              '"liberty-lincoln-50-12-burgundy-gloss-signature-interior-loaded-interior.webp"',
              '"liberty-lincoln-50-12-burgundy-gloss-signature-interior-loaded.webp"'
          )
          text=text.replace(
              '"LIBERTY_LINCOLN_25_9_BRONZE_GLOSS_BC_SIGNATURE_INTERIOR_LOADED_INTERIOR.webp"',
              '"LIBERTY_LINCOLN_25_9_BRONZE_GLOSS_BC_SIGNATURE_INTERIOR_LOADED.webp"'
          )
          text=text.replace('"Version 2.2.0"', '"Version 2.2.2"')
          text=text.replace("'src=\"./naming-ui.js\"'", "'src=\"./naming-ui.js?v=1.0.2\"'")

          insert='''\nconst lx50DoubleHyphen = buildProposedName(\n  reusable,\n  inferFileRecord("LX-Sig-50-Champagne Marble--Open-Empty-ProFlex-interior.webp")\n);\nassert.equal(lx50DoubleHyphen.ready, true);\nassert.equal(\n  lx50DoubleHyphen.filename,\n  "liberty-lincoln-50-2-champagne-marble-signature-interior-empty.webp"\n);\n'''
          marker='''const lx50Burgundy = buildProposedName(\n  reusable,\n  inferFileRecord("LX-Sig-50-Burgundy Gloss-Open-Loaded-ProFlex-interior.webp")\n);'''
          if marker not in text:
              raise SystemExit("Expected LX50 Burgundy marker not found")
          text=text.replace(marker, insert+"\n"+marker,1)
          p.write_text(text)

          # Keep the normal MediaForge production deploy contract aligned with this release.
          p=Path(".github/workflows/mediaforge-deploy.yml")
          deploy=p.read_text()
          deploy=deploy.replace("Version: 1.0.0", "Version: 1.0.1", 1)
          deploy=deploy.replace('["Version 2.2.0", "Flexible Naming Recipes", \'id="namingPreset"\']', '["Version 2.2.2", "Flexible Naming Recipes", \'id="namingPreset"\']')
          deploy=deploy.replace("PASS live MediaForge 2.2.0 flexible naming UI", "PASS live MediaForge 2.2.2 flexible naming UI")
          p.write_text(deploy)
          PY

      - name: Run MediaForge naming regression
        run: npm run test:mediaforge-naming

      - name: Reassemble Kristy source ZIPs
        shell: bash
        run: |
          mkdir -p /tmp/mediaforge
          cat temp/mediaforge-input/lx40/part-*.b64 | base64 -d > /tmp/mediaforge/lx40.zip
          cat temp/mediaforge-input/lx50/part-*.b64 | base64 -d > /tmp/mediaforge/lx50.zip
          unzip -t /tmp/mediaforge/lx40.zip
          unzip -t /tmp/mediaforge/lx50.zip

      - name: Produce final renamed ZIPs and manifests
        shell: bash
        run: |
          python <<'PY'
          import csv, os, re, zipfile
          from pathlib import Path

          OUT=Path("mediaforge/downloads")
          OUT.mkdir(parents=True, exist_ok=True)

          COLORS={
              "white marble": (1,"white-marble"),
              "champagne marble": (2,"champagne-marble"),
              "gray marble": (3,"gray-marble"),
              "burgundy marble": (4,"burgundy-marble"),
              "green marble": (5,"green-marble"),
              "white ivory gloss": (6,"white-gloss"),
              "white gloss": (6,"white-gloss"),
              "champagne gloss": (7,"champagne-gloss"),
              "gray gloss": (8,"gray-gloss"),
              "bronze gloss": (9,"bronze-gloss"),
              "forest mist gloss": (10,"forest-mist-gloss"),
              "green gloss": (11,"green-gloss"),
              "burgundy gloss": (12,"burgundy-gloss"),
              "black cherry gloss": (13,"black-cherry-gloss"),
              "black gloss(sv and bv)": (14,"black-gloss"),
              "black gloss": (14,"black-gloss"),
              "blue gloss": (22,"blue-gloss"),
          }

          def parse(name, size):
              base=os.path.basename(name)
              m=re.match(rf"^LX-Sig-{size}-(.+?)-+Open-(.+?)-interior\.webp$", base, re.I)
              if not m:
                  raise ValueError(f"Unrecognized source filename: {name}")
              color=re.sub(r"[-\s]+$", "", m.group(1)).strip()
              tail=m.group(2)
              if re.search(r"full\s*no\s*guns", tail, re.I): state="full-no-guns"
              elif re.search(r"loaded", tail, re.I): state="loaded"
              elif re.search(r"empty", tail, re.I): state="empty"
              else: raise ValueError(f"Unrecognized interior state: {name}")
              key=color.lower().strip()
              if key == "textured bronze":
                  return {"excluded":True,"color":"textured-bronze","state":state}
              if key not in COLORS:
                  raise ValueError(f"Unmapped Lincoln color {color!r}: {name}")
              order,slug=COLORS[key]
              final=f"liberty-lincoln-{size}-{order}-{slug}-signature-interior-{state}.webp"
              return {"excluded":False,"order":order,"color":slug,"state":state,"final":final}

          for size in (40,50):
              src=Path(f"/tmp/mediaforge/lx{size}.zip")
              final_zip=OUT/f"kristy-lincoln-{size}-signature-interiors-renamed.zip"
              manifest=OUT/f"kristy-lincoln-{size}-signature-interiors-manifest.csv"
              rows=[]
              names_seen=set()
              ready=excluded=0

              with zipfile.ZipFile(src) as zin, zipfile.ZipFile(final_zip,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zout:
                  for info in zin.infolist():
                      if info.is_dir():
                          continue
                      parsed=parse(info.filename,size)
                      raw=zin.read(info.filename)
                      if parsed["excluded"]:
                          excluded+=1
                          rows.append({
                              "original_filename":info.filename,
                              "final_filename":"",
                              "order":"",
                              "color":parsed["color"],
                              "state":parsed["state"],
                              "bytes_preserved":"yes",
                              "status":"excluded — Liberty source naming mistake"
                          })
                          continue
                      if parsed["final"] in names_seen:
                          raise ValueError(f"Duplicate proposed output: {parsed['final']}")
                      names_seen.add(parsed["final"])
                      zout.writestr(parsed["final"], raw)
                      ready+=1
                      rows.append({
                          "original_filename":info.filename,
                          "final_filename":parsed["final"],
                          "order":parsed["order"],
                          "color":parsed["color"],
                          "state":parsed["state"],
                          "bytes_preserved":"yes",
                          "status":"ready"
                      })

              with manifest.open("w",newline="") as f:
                  writer=csv.DictWriter(f,fieldnames=["original_filename","final_filename","order","color","state","bytes_preserved","status"])
                  writer.writeheader(); writer.writerows(rows)

              expected={40:(42,3),50:(45,3)}[size]
              if (ready,excluded) != expected:
                  raise ValueError(f"LX{size}: expected ready/excluded {expected}, got {(ready,excluded)}")

              with zipfile.ZipFile(final_zip) as verify:
                  if len(verify.namelist()) != ready:
                      raise ValueError(f"LX{size}: output ZIP count mismatch")
                  for name in verify.namelist():
                      if not re.search(r"signature-interior-(?:empty|loaded|full-no-guns)\.webp$",name):
                          raise ValueError(f"LX{size}: output naming contract failed: {name}")
              print(f"LX{size}_RESULT ready={ready} excluded={excluded} zip={final_zip} manifest={manifest}")
          PY

      - name: Deploy corrected MediaForge and deliverables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PAGES_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          cd mediaforge
          npx --yes wrangler@4.122.0 pages deploy . \
            --project-name=mediaforge-36x \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Lincoln Signature Interiors 25/40/50 v2 convention"

      - name: Verify live MediaForge and downloads
        shell: bash
        run: |
          node <<'NODE'
          const base="https://mediaforge-36x.pages.dev";
          const page=await fetch(`${base}/?verify=${Date.now()}`,{cache:"no-store"});
          if(!page.ok) throw new Error(`MediaForge HTTP ${page.status}`);
          const html=await page.text();
          for(const marker of ["Version 2.2.2","Flexible Naming Recipes"]){
            if(!html.includes(marker)) throw new Error(`Missing live marker: ${marker}`);
          }
          for(const file of [
            "downloads/kristy-lincoln-40-signature-interiors-renamed.zip",
            "downloads/kristy-lincoln-50-signature-interiors-renamed.zip",
            "downloads/kristy-lincoln-40-signature-interiors-manifest.csv",
            "downloads/kristy-lincoln-50-signature-interiors-manifest.csv"
          ]){
            const r=await fetch(`${base}/${file}?verify=${Date.now()}`,{cache:"no-store"});
            if(!r.ok) throw new Error(`${file} returned HTTP ${r.status}`);
            console.log(`PASS ${file} ${r.headers.get("content-length") || "unknown-size"}`);
          }
          NODE

      - name: Commit corrected engine and Kristy deliverables
        shell: bash
        run: |
          git config user.name "globalconceptsmediallc-oss"
          git config user.email "globalconceptsmediallc@gmail.com"
          git add mediaforge/naming.js mediaforge/naming-ui.js mediaforge/index.html tests/mediaforgeNamingRecipe.test.js .github/workflows/mediaforge-deploy.yml mediaforge/downloads/
          git commit -m "Finish Kristy Lincoln 40 and 50 Signature Interior requests"
          git pull --rebase origin main
          git push origin HEAD:main
