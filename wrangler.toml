# GCM OS | Worker bindings
# File: wrangler.toml
# Version: 1.0.3
# Change: Schedule protected daily 30-day Radar evidence cleanup at 12:00 UTC.
# R2 remains private. No public image access; protected R2 deletion occurs only after archive eligibility.
name = "gcm-business-intelligence-worker"
main = "worker.js"
compatibility_date = "2026-07-02"

[vars]
ENVIRONMENT = "development"

[ai]
binding = "AI"

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "DB"
database_name = "gcm-operating-system"
database_id = "ce93408a-85ee-4103-88aa-cd4a12169305"

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "gcm-os-source-evidence-private"

[triggers]
crons = ["0 12 * * *"]
