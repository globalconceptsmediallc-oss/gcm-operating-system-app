# GCM OS | Worker bindings
# File: wrangler.toml
# Version: 1.0.2
# Change: Persist approved private R2 binding and retry deployment after test-lock alignment.
# R2 objects remain private; upload, read and lifecycle routes are not enabled yet.
name = "gcm-business-intelligence-worker"
main = "worker.js"
compatibility_date = "2026-07-02"

[vars]
ENVIRONMENT = "development"

[ai]
binding = "AI"

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "DB"
database_name = "gcm-operating-system"
database_id = "ce93408a-85ee-4103-88aa-cd4a12169305"

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "gcm-os-source-evidence-private"
